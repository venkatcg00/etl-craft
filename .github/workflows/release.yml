name: Release gate

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

env:
  ETL_CRAFT_ACTOR: github:${{ github.actor }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: every required suite has passing evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate compares each evidence commit with HEAD, so it needs the history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Release gate
        run: make release-gate

  chaos:
    name: chaos (${{ matrix.engine }}, 20 consecutive runs)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        engine: [engine_sqlite, engine_postgres]
    env:
      ETL_CRAFT_REQUIRE_SERVICES: "1"
      CHAOS_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Start local services
        run: make services-up
      - name: Require twenty consecutive passes
        run: |
          mkdir -p chaos-results
          for iteration in {1..20}; do
            echo "Chaos iteration $iteration/20 ($CHAOS_ENGINE)"
            uv run pytest -q -x -m "chaos and $CHAOS_ENGINE" --junitxml="chaos-results/iteration-$iteration.xml"
          done
      - name: Upload iteration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-${{ matrix.engine }}
          path: chaos-results/
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local services
        if: always()
        run: make services-down
