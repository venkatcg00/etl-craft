name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache:
        description: Dependency-cache condition for deliberate timing validation
        type: choice
        options: [warm, cold]
        default: warm
      serial:
        description: Collect unsharded timing evidence on the complete existing matrix
        type: boolean
        default: false

env:
  ETL_CRAFT_ACTOR: github:${{ github.actor }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: build package and plan complete matrix
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.plan.outputs.coverage }}
      service: ${{ steps.plan.outputs.service }}
      e2e: ${{ steps.plan.outputs.e2e }}
      wheel: ${{ steps.plan.outputs.wheel }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - name: Build the wheel and source distribution once
        run: uv build --python 3.11 --out-dir dist
      - name: Plan every existing test combination
        id: plan
        env:
          SERIAL: ${{ inputs.serial || false }}
        run: |
          args=()
          if [ "$SERIAL" = true ]; then args+=(--serial); fi
          uv run --no-project --python 3.11 python scripts/ci_shards.py matrix --output "$GITHUB_OUTPUT" "${args[@]}"
          uv run --no-project --python 3.11 python -c 'from pathlib import Path; print("wheel=" + next(Path("dist").glob("*.whl")).name)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-and-sdist
          path: dist/
          if-no-files-found: error

  static:
    name: lint / types / layers / history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Lint and format check
        run: make lint
      - name: mypy --strict
        run: make typecheck
      - name: Layer contracts
        run: make imports
      - name: History gate
        run: make history
      - name: Regression traceability
        run: make regressions
      - name: Quality baseline
        run: make quality

  test:
    name: coverage (${{ matrix.python }}, ${{ matrix.os }}, shard ${{ matrix.index }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.coverage) }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        id: uv
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - run: uv sync --locked --all-groups --python ${{ matrix.python }}
      - name: Execute assigned tests and record complete collection
        env:
          ETL_CRAFT_CI_CACHE_MODE: ${{ inputs.cache || 'warm' }}
          ETL_CRAFT_CI_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: uv run python scripts/ci_shards.py run '${{ matrix.profile }}' '${{ matrix.index }}' '${{ matrix.count }}' "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-${{ matrix.profile }}-${{ matrix.index }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error

  service:
    name: local services (${{ matrix.profile }}, shard ${{ matrix.index }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.service) }}
    env:
      ETL_CRAFT_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        id: uv
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - run: uv sync --locked --all-groups --python 3.11
      - name: Start the services this suite requires
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PROFILE" = engine ]; then
            docker compose up -d --wait postgres mailpit
          else
            make services-up
          fi
      - name: Execute assigned service tests
        env:
          ETL_CRAFT_CI_CACHE_MODE: ${{ inputs.cache || 'warm' }}
          ETL_CRAFT_CI_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: uv run python scripts/ci_shards.py run '${{ matrix.profile }}' '${{ matrix.index }}' '${{ matrix.count }}' "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-${{ matrix.profile }}-${{ matrix.index }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the local services
        if: always()
        run: make services-down

  e2e:
    name: installed demo (${{ matrix.warehouse }}, shard ${{ matrix.index }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.e2e) }}
    env:
      ETL_CRAFT_REQUIRE_SERVICES: "1"
      ETL_CRAFT_E2E_WAREHOUSE: ${{ matrix.warehouse }}
      ETL_CRAFT_TEST_WHEEL: ${{ github.workspace }}/dist/${{ needs.prepare.outputs.wheel }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        id: uv
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - run: uv sync --locked --all-groups --python 3.11
      - uses: actions/download-artifact@v8
        with:
          name: wheel-and-sdist
          path: dist
      - name: Start the Engine DB, relay and selected warehouse
        env:
          WAREHOUSE: ${{ matrix.warehouse }}
        run: |
          services=(postgres mailpit)
          case "$WAREHOUSE" in
            duckdb_iceberg) services+=(iceberg-rest) ;;
            trino_iceberg) services+=(trino) ;;
          esac
          docker compose up -d --wait "${services[@]}"
      - name: Run installed-wheel demo partition
        env:
          ETL_CRAFT_CI_CACHE_MODE: ${{ inputs.cache || 'warm' }}
          ETL_CRAFT_CI_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: uv run python scripts/ci_shards.py run '${{ matrix.profile }}' '${{ matrix.index }}' '${{ matrix.count }}' "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-${{ matrix.profile }}-${{ matrix.index }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the local services
        if: always()
        run: make services-down

  package:
    name: package (build, install with pip and uv, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build and verify the package
        run: make verify-package

      - name: Record package validation
        run: python scripts/ci_shards.py record package-${{ matrix.os }} "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-package-${{ matrix.os }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error

  airflow:
    name: Airflow contract (${{ matrix.airflow-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        airflow-version: ["2.11.0", "3.3.2"]
    env:
      AIRFLOW_HOME: /tmp/etl-craft-airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      ETL_CRAFT_AIRFLOW_CONTRACTS: /tmp/etl-craft-airflow-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - name: Install engine test dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Export every demo pipeline
        run: uv run python scripts/export_airflow_contracts.py "$ETL_CRAFT_AIRFLOW_CONTRACTS"
      - name: Install factory with real Airflow in an isolated environment
        run: |
          uv venv "$RUNNER_TEMP/airflow-venv" --python 3.11
          uv pip install --python "$RUNNER_TEMP/airflow-venv/bin/python" \
            "apache-airflow==${{ matrix.airflow-version }}" pytest mypy \
            types-pyyaml types-jsonschema ./integrations/airflow
      - name: Validate operator graphs, commands and refused exports
        run: >-
          "$RUNNER_TEMP/airflow-venv/bin/python" -m pytest -q integrations/airflow/tests
      - name: Type-check the isolated factory
        run: >-
          "$RUNNER_TEMP/airflow-venv/bin/python" -m mypy --strict
          --follow-imports=skip --ignore-missing-imports integrations/airflow/src
      - name: Record Airflow validation
        run: uv run python scripts/ci_shards.py record airflow-${{ matrix.airflow-version }} "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-airflow-${{ matrix.airflow-version }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error

  complete:
    name: every test and matrix accounted for
    if: always()
    needs: [prepare, static, test, service, e2e, package, airflow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - run: uv sync --locked --all-groups --python 3.11
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-*
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@v8
        with:
          name: wheel-and-sdist
          path: dist
      - name: Verify all jobs, outcomes, identities and combined coverage
        env:
          ETL_CRAFT_CI_JOBS: ${{ toJSON(needs) }}
          SERIAL: ${{ inputs.serial || false }}
          WHEEL: ${{ needs.prepare.outputs.wheel }}
        run: |
          args=()
          if [ "$SERIAL" = true ]; then args+=(--serial); fi
          uv run python scripts/ci_shards.py verify "$RUNNER_TEMP/results" "dist/$WHEEL" "${args[@]}"
