name: CI

on:
  pull_request:
    branches: [main]
  # [ADDITION, 2026-09-20, E2-28] Nothing ran on push, so `main` could be
  # broken by a merge whose base had moved since the PR was last checked.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: py${{ matrix.python-version }} / lint / types / tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # [ADDITION, 2026-09-20, E2-28] requires-python is ">=3.11", and only
        # 3.11 was ever tested, so 3.12/3.13 support was a claim rather than a
        # fact.
        python-version: ["3.11", "3.12", "3.13"]
    services:
      # Native GitHub Actions service container — no Docker Compose needed
      # here (that's for local dev; see docker-compose.yml/Makefile). This
      # gives the Postgres-backed tests in tests/test_integration.py a real
      # Engine DB to run against instead of skipping themselves.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etl_craft
          POSTGRES_PASSWORD: etl_craft
          POSTGRES_DB: etl_craft
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U etl_craft -d etl_craft"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # Used by the Python test suite (SQLAlchemy's dialect-qualified URI
      # scheme — psql/libpq don't understand "+psycopg").
      ETL_CRAFT_TEST_DATABASE_URL: postgresql+psycopg://etl_craft:etl_craft@localhost:55432/etl_craft
      # Used by the plain `psql` steps below instead: libpq's standard PG*
      # env vars, so those steps need no connection string at all. Keeping
      # these separate avoids the URI-scheme mismatch — the first version of
      # this workflow reused ETL_CRAFT_TEST_DATABASE_URL for psql directly,
      # and libpq silently fell back to a local Unix socket (which doesn't
      # exist in this job) instead of erroring on the unrecognized scheme.
      PGHOST: localhost
      PGPORT: "55432"
      PGUSER: etl_craft
      PGPASSWORD: etl_craft
      PGDATABASE: etl_craft
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Apply the PostgreSQL Engine DB schema
        run: psql -v ON_ERROR_STOP=1 -f src/etl_craft/dialects/engine_dialects/postgres/schema.sql

      # [DEVIATION, 2026-09-20, E2-26/E2-27] Two fixes. ON_ERROR_STOP=1, because
      # schema_test.sql is now self-asserting and its exit code is the result —
      # without it this step always exited 0 and nobody read the output. And a
      # disposable database, mirroring the Makefile: schema_test.sql leaves its
      # own PL_A/PL_B rows behind, which already broke a globally-scoped query
      # once, and it hardcodes PIPELINE_ID = 1/2 so it is only correct against
      # a genuinely empty database.
      - name: schema_test.sql (self-asserting, disposable database)
        run: |
          psql -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS etl_craft_schema_test"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE etl_craft_schema_test"
          psql -v ON_ERROR_STOP=1 -d etl_craft_schema_test -f src/etl_craft/dialects/engine_dialects/postgres/schema.sql
          psql -v ON_ERROR_STOP=1 -d etl_craft_schema_test -f src/etl_craft/dialects/engine_dialects/postgres/schema_test.sql
          psql -v ON_ERROR_STOP=1 -c "DROP DATABASE etl_craft_schema_test"

      - name: black --check
        run: uv run black --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pydocstyle
        run: uv run pydocstyle .

      - name: mypy
        run: uv run mypy src/etl_craft

      # The Iceberg warehouse (MinIO + Iceberg REST catalog + Trino) comes up
      # through Compose rather than `services:` above, because it needs an
      # init container to create the bucket and a config-file mount for
      # Trino's catalog — neither of which `services:` can express. Postgres
      # is deliberately excluded here: it is already a service container on
      # port 55432 and would collide.
      - name: Start the local Iceberg warehouse (MinIO + REST catalog + Trino)
        run: docker compose up -d --wait minio minio-init iceberg-rest trino

      - name: pytest with coverage (fails under 80%)
        run: uv run pytest -q --cov=etl_craft --cov-report=term-missing

      # SQLite is the default Engine DB; the same suite runs against it too.
      - name: pytest with a SQLite Engine DB
        run: uv run pytest -q
        env:
          ETL_CRAFT_TEST_ENGINE: sqlite

      - name: Stop the Iceberg warehouse
        if: always()
        run: docker compose down -v

  # [ADDITION, 2026-09-20, E2-28] The gap that hid E2-13: a test suite always
  # running from the git checkout cannot see packaging bugs at all. This builds
  # the wheel, installs it into a clean venv outside the checkout, and drives
  # it against a disposable database.
  wheel:
    name: wheel build / install / smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etl_craft
          POSTGRES_PASSWORD: etl_craft
          POSTGRES_DB: etl_craft
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U etl_craft -d etl_craft"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: "55432"
      PGUSER: etl_craft
      PGPASSWORD: etl_craft
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build, install and smoke-test the wheel
        run: ./scripts/wheel-smoke.sh
