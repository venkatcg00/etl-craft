name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: black / ruff / pydocstyle / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: black --check
        run: uv run black --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pydocstyle
        run: uv run pydocstyle .

      - name: pytest
        run: uv run pytest -q
