name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint / types / layers / history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Lint and format check
        run: make lint
      - name: mypy --strict
        run: make typecheck
      - name: Layer contracts
        run: make imports
      - name: History gate
        run: make history

  test:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Overrides .python-version so `uv run` keeps the matrix interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - name: Tests with coverage
        run: make coverage

  package:
    name: package (build, install with pip and uv, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build and verify the package
        run: make verify-package

  services:
    name: local services (harness)
    runs-on: ubuntu-latest
    env:
      ETL_CRAFT_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Start the local services
        run: make services-up
      - name: Harness tests
        run: make test-harness
      - name: Engine DB tests on SQLite and PostgreSQL
        run: uv run pytest -q -m "engine_sqlite or engine_postgres"
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the local services
        if: always()
        run: make services-down
