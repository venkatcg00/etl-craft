name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache:
        description: Dependency-cache condition for deliberate timing validation
        type: choice
        options: [warm, cold]
        default: warm
      serial:
        description: Collect unsharded timing evidence on the complete existing matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: build package and plan complete matrix
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.plan.outputs.coverage }}
      service: ${{ steps.plan.outputs.service }}
      e2e: ${{ steps.plan.outputs.e2e }}
      wheel: ${{ steps.plan.outputs.wheel }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - name: Build the wheel and source distribution once
        run: uv build --python 3.11 --out-dir dist
      - name: Plan every existing test combination
        id: plan
        env:
          SERIAL: ${{ inputs.serial || false }}
        run: |
          args=()
          if [ "$SERIAL" = true ]; then args+=(--serial); fi
          uv run --no-project --python 3.11 python scripts/ci_shards.py matrix --output "$GITHUB_OUTPUT" "${args[@]}"
          uv run --no-project --python 3.11 python -c 'from pathlib import Path; print("wheel=" + next(Path("dist").glob("*.whl")).name)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-and-sdist
          path: dist/
          if-no-files-found: error

  static:
    name: lint / types / layers / history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Lint and format check
        run: make lint
      - name: mypy --strict
        run: make typecheck
      - name: Layer contracts
        run: make imports
      - name: History gate
        run: make history
      - name: Regression traceability
        run: make regressions
      - name: Quality baseline
        run: make quality

  test:
    name: coverage (${{ matrix.python }}, ${{ matrix.os }}, shard ${{ matrix.index }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.coverage) }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        id: uv
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - run: uv sync --locked --all-groups --python ${{ matrix.python }}
      - name: Start the relay and database required by SQLite integration tests
        if: matrix.profile == 'coverage-3.11-ubuntu-latest'
        run: docker compose up -d --wait postgres mailpit
      - name: Execute assigned tests and record complete collection
        env:
          ETL_CRAFT_REQUIRE_SERVICES: "1"
          ETL_CRAFT_CI_CACHE_MODE: ${{ inputs.cache || 'warm' }}
          ETL_CRAFT_CI_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: uv run python scripts/ci_shards.py run '${{ matrix.profile }}' '${{ matrix.index }}' '${{ matrix.count }}' "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-${{ matrix.profile }}-${{ matrix.index }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
      - name: Stop the SQLite integration services
        if: always() && matrix.profile == 'coverage-3.11-ubuntu-latest'
        run: make services-down

  browser:
    name: browser sessions and accessibility
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - run: uv sync --locked --all-groups --python 3.11
      - run: uv run playwright install --with-deps chromium firefox
      - name: Execute browser tests and record complete collection
        env:
          ETL_CRAFT_REQUIRE_SERVICES: "1"
        run: uv run python scripts/ci_shards.py run browser 0 1 "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-browser-0
          path: ${{ runner.temp }}/result
          if-no-files-found: error

  service:
    name: local services (${{ matrix.profile }}, shard ${{ matrix.index }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.service) }}
    env:
      ETL_CRAFT_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        id: uv
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - run: uv sync --locked --all-groups --python 3.11
      - name: Start the services this suite requires
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          case "$PROFILE" in
            engine) docker compose up -d --wait postgres mailpit ;;
            warehouse-local) make services-up ;;
            warehouse-iceberg) docker compose up -d --wait postgres trino ;;
            *) echo "Unknown service profile: $PROFILE" >&2; exit 1 ;;
          esac
      - name: Execute assigned service tests
        env:
          ETL_CRAFT_CI_CACHE_MODE: ${{ inputs.cache || 'warm' }}
          ETL_CRAFT_CI_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: uv run python scripts/ci_shards.py run '${{ matrix.profile }}' '${{ matrix.index }}' '${{ matrix.count }}' "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-${{ matrix.profile }}-${{ matrix.index }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the local services
        if: always()
        run: make services-down

  e2e:
    name: installed demo (${{ matrix.warehouse }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.e2e) }}
    env:
      ETL_CRAFT_CI_DIAGNOSTICS: ${{ github.workspace }}/dist/demo-diagnostics
      ETL_CRAFT_REQUIRE_SERVICES: "1"
      ETL_CRAFT_E2E_WAREHOUSE: ${{ matrix.warehouse }}
      ETL_CRAFT_TEST_WHEEL: ${{ github.workspace }}/dist/${{ needs.prepare.outputs.wheel }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        id: uv
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - run: uv sync --locked --all-groups --python 3.11
      - uses: actions/download-artifact@v8
        with:
          name: wheel-and-sdist
          path: dist
      - name: Start the Engine DB, relay and selected warehouse
        env:
          WAREHOUSE: ${{ matrix.warehouse }}
        run: |
          services=(postgres mailpit)
          case "$WAREHOUSE" in
            duckdb_iceberg) services+=(iceberg-rest) ;;
            trino_iceberg) services+=(trino) ;;
          esac
          docker compose up -d --wait "${services[@]}"
      - name: Run isolated demo workers against the warehouse
        env:
          ETL_CRAFT_CI_CACHE_MODE: ${{ inputs.cache || 'warm' }}
          ETL_CRAFT_CI_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: uv run python scripts/ci_shards.py run-all '${{ matrix.profile }}' '${{ matrix.count }}' "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-${{ matrix.profile }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Preserve installed-demo failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-failure-${{ matrix.warehouse }}
          path: dist/demo-diagnostics/
          if-no-files-found: warn
      - name: Stop the local services
        if: always()
        run: make services-down

  package:
    needs: static
    env:
      UV_PYTHON: ${{ matrix.os == 'macos-latest' && '3.13' || '3.11' }}
    name: package (build, install with pip and uv, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.UV_PYTHON }}
      - name: Build and verify the package
        run: make verify-package

      - name: Install macOS compatibility dependencies
        if: matrix.os == 'macos-latest'
        run: uv sync --locked --all-groups --python "$UV_PYTHON"
      - name: Check macOS units and SQLite transitions on the package runner
        if: matrix.os == 'macos-latest'
        run: uv run python scripts/ci_shards.py run "coverage-$UV_PYTHON-macos-latest" 0 1 "$RUNNER_TEMP/result/compatibility"

      - name: Record package validation
        run: python scripts/ci_shards.py record package-${{ matrix.os }} "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-package-${{ matrix.os }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error

  complete:
    name: every test and matrix accounted for
    if: always()
    needs: [prepare, static, test, service, e2e, package, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ inputs.cache != 'cold' }}
      - run: uv sync --locked --all-groups --python 3.11
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-*
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@v8
        with:
          name: wheel-and-sdist
          path: dist
      - name: Verify all jobs, outcomes, identities and combined coverage
        env:
          ETL_CRAFT_CI_JOBS: ${{ toJSON(needs) }}
          SERIAL: ${{ inputs.serial || false }}
          WHEEL: ${{ needs.prepare.outputs.wheel }}
        run: |
          args=()
          if [ "$SERIAL" = true ]; then args+=(--serial); fi
          uv run python scripts/ci_shards.py verify "$RUNNER_TEMP/results" "dist/$WHEEL" "${args[@]}"
