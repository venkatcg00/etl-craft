name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: black / ruff / pydocstyle / pytest / coverage
    runs-on: ubuntu-latest
    services:
      # Native GitHub Actions service container — no Docker Compose needed
      # here (that's for local dev; see docker-compose.yml/Makefile). This
      # gives the Postgres-backed tests in tests/test_integration.py a real
      # Engine DB to run against instead of skipping themselves.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etl_craft
          POSTGRES_PASSWORD: etl_craft
          POSTGRES_DB: etl_craft
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U etl_craft -d etl_craft"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Stands in as a genuinely different SQLAlchemy dialect for
      # warehouse.py's tests — see docker-compose.yml's own comment on the
      # equivalent local service. Only exercised when the `clickhouse` extra
      # is installed (it's in the dev group, so `uv sync --all-groups`
      # below pulls it in); tests skip themselves otherwise.
      clickhouse:
        image: clickhouse/clickhouse-server:24
        env:
          CLICKHOUSE_USER: etl_craft
          CLICKHOUSE_PASSWORD: etl_craft
          CLICKHOUSE_DB: etl_craft
        ports:
          - 58123:8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping || exit 1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Used by the Python test suite (SQLAlchemy's dialect-qualified URI
      # scheme — psql/libpq don't understand "+psycopg").
      ETL_CRAFT_TEST_DATABASE_URL: postgresql+psycopg://etl_craft:etl_craft@localhost:55432/etl_craft
      ETL_CRAFT_TEST_CLICKHOUSE_URL: clickhouse://etl_craft:etl_craft@localhost:58123/etl_craft
      # Used by the plain `psql` steps below instead: libpq's standard PG*
      # env vars, so those steps need no connection string at all. Keeping
      # these separate avoids the URI-scheme mismatch — the first version of
      # this workflow reused ETL_CRAFT_TEST_DATABASE_URL for psql directly,
      # and libpq silently fell back to a local Unix socket (which doesn't
      # exist in this job) instead of erroring on the unrecognized scheme.
      PGHOST: localhost
      PGPORT: "55432"
      PGUSER: etl_craft
      PGPASSWORD: etl_craft
      PGDATABASE: etl_craft
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Apply src/etl_craft/sql/schema.sql
        run: psql -v ON_ERROR_STOP=1 -f src/etl_craft/sql/schema.sql

      - name: src/etl_craft/sql/schema_test.sql (schema behavioral smoke test)
        run: psql -f src/etl_craft/sql/schema_test.sql

      - name: black --check
        run: uv run black --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pydocstyle
        run: uv run pydocstyle .

      - name: pytest with coverage (fails under 80%)
        run: uv run pytest -q --cov=etl_craft --cov-report=term-missing
