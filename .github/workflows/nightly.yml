name: Nightly

# Pull requests test the locked dependencies. Each night this workflow resolves the newest release
# of every dependency instead, so an upstream release that breaks etl-craft fails here first rather
# than on an unrelated pull request. A change to this file runs it on its pull request.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [.github/workflows/nightly.yml]

env:
  ETL_CRAFT_ACTOR: github:${{ github.actor }}

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newest:
    name: newest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install the newest release of every dependency
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project > "$RUNNER_TEMP/locked.txt"
          uv sync --upgrade --all-groups --python 3.11
          uv export --all-groups --no-hashes --no-emit-project > "$RUNNER_TEMP/newest.txt"
      - name: Releases newer than uv.lock
        run: diff "$RUNNER_TEMP/locked.txt" "$RUNNER_TEMP/newest.txt" || true
      # The unit tests include checks that a missing service is skipped, so they run without
      # ETL_CRAFT_REQUIRE_SERVICES; the service steps set it.
      - name: Unit tests
        run: uv run pytest -q -m unit
      - name: Start the local services
        run: make services-up
      - name: Engine DB tests on SQLite and PostgreSQL
        env:
          ETL_CRAFT_REQUIRE_SERVICES: "1"
        run: uv run pytest -q -m "engine_sqlite or engine_postgres"
      - name: Warehouse tests on every local warehouse
        env:
          ETL_CRAFT_REQUIRE_SERVICES: "1"
        run: >-
          uv run pytest -q -m "warehouse_postgres or warehouse_duckdb or
          warehouse_duckdb_iceberg or warehouse_trino_iceberg"
      - name: The demo from the wheel, installed with pip and with uv
        env:
          ETL_CRAFT_REQUIRE_SERVICES: "1"
          ETL_CRAFT_E2E_WAREHOUSE: duckdb
        run: |
          uv build --wheel --out-dir dist
          export ETL_CRAFT_TEST_WHEEL="$(ls "$PWD"/dist/*.whl)"
          uv run pytest -q -m "e2e_pip or e2e_uv"
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the local services
        if: always()
        run: make services-down
