# [DEVIATION, 2026-09-20, E2-28] This was the unmodified GitHub template, with
# `package-ecosystem: ""` — so it matched nothing and updated nothing.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
