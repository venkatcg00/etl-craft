# Run behind the organization's TLS and authentication gateway, or add those controls here.
worker_processes 1;
pid /tmp/etl-craft-catalog-nginx.pid;
error_log /dev/stderr;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    server {
        listen 127.0.0.1:8081;
        server_name docs.example.com;
        location / {
            # No URI suffix: preserve External_url's prefix on requests to the backend.
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            # Replace the client-supplied header at this public trust boundary.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_redirect off;
        }
    }
}
