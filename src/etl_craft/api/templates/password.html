{% extends 'base.html' %}{% block content %}<h1>Change password</h1>{% if identity.must_change_password %}<p class="notice">Your temporary password must be changed before continuing.</p>{% endif %}<form class="panel" method="post" action="/api/v1/account/password" hx-post="/api/v1/account/password" hx-ext="json-enc" hx-target="#result"><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="_return_to" value="{{ return_to }}"><label for="current-password">Current password</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required><label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="_confirm_password" type="password" autocomplete="new-password" required><button type="submit">Change password and sign out</button></form>{% endblock %}
