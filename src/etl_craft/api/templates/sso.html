<section id="sso-flow" data-device-code="{{ grant.device_code }}" data-nonce="{{ grant.nonce }}" data-interval="{{ grant.interval }}" data-expires-in="{{ grant.expires_in }}" data-return-to="{{ return_to }}"><h2>Approve SSO sign-in</h2><p>Code: <strong>{{ grant.user_code }}</strong></p><a href="{{ grant.verification_uri }}" target="_blank" rel="noopener">Open your identity provider ↗ <span class="sr-only">(opens in a new tab)</span></a><p role="status">Waiting for approval…</p></section>
