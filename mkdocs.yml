site_name: etl-craft
site_description: Metadata-driven ETL orchestration engine
site_url: https://venkatcg00.github.io/etl-craft/
repo_url: https://github.com/venkatcg00/etl-craft
repo_name: venkatcg00/etl-craft
edit_uri: edit/main/docs/
copyright: Apache License 2.0

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The reference generators run at build time; they are not pages.
exclude_docs: |
  development/ui-wireframes/
  gen_python_api.py
  gen_cli_page.py
  gen_reference_pages.py
  gen_openapi.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_python_api.py
        - docs/gen_cli_page.py
        - docs/gen_reference_pages.py
        - docs/gen_openapi.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false

extra:
  version:
    provider: mike

# With `mkdocs build --strict`, each of these warnings fails the build.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

