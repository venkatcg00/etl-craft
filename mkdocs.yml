site_name: etl-craft
site_description: Metadata-driven ETL orchestration engine
site_url: https://venkatcg00.github.io/etl-craft/
repo_url: https://github.com/venkatcg00/etl-craft
repo_name: venkatcg00/etl-craft
edit_uri: edit/main/docs/
copyright: Apache License 2.0

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The API reference generator runs at build time; it is not a page.
exclude_docs: |
  gen_ref_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
        - docs/gen_cli_page.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false

extra:
  version:
    provider: mike

# With `mkdocs build --strict`, each of these warnings fails the build.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Guides:
      - guides/index.md
      - Dependencies and run conditions: guides/dependencies.md
      - SQL tasks: guides/sql-tasks.md
      - Business rules: guides/business-rules.md
      - Ingestion scripts: guides/ingestion-scripts.md
      - Email alerts: guides/email-alerts.md
      - Validating pipelines: guides/validating.md
      - Inspecting pipelines: guides/inspecting.md
      - Lineage and documentation versions: guides/lineage.md
      - The catalog site: guides/catalog.md
      - Running a pipeline: guides/running-pipelines.md
      - Running a task and reading its logs: guides/running-tasks.md
      - "Stepping in: mark, cancel, rerun and bypasses": guides/run-control.md
  - Deploying:
      - deploying/index.md
      - The project directory: deploying/project-layout.md
      - Running under an orchestrator: deploying/orchestrator.md
      - Checking a deployment, doctor and setup: deploying/doctor-and-setup.md
      - Engine DB setup and upgrades: deploying/engine-db.md
      - Cloning into the warehouse: deploying/cloning.md
  - Connectors:
      - connectors/index.md
      - Engine DB: connectors/engine-db.md
      - Warehouses: connectors/warehouses.md
      - craft-connector.yml examples: examples/README.md
  - Reference:
      - reference/index.md
      - Command line: reference/cli.md
      - Exit codes: reference/exit-codes.md
      - Python API: api/
  - Release notes: release-notes.md
  - Contributing:
      - contributing.md
      - Rewrite plan: development/rewrite-plan.md
