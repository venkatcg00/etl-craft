# Trino's Iceberg connector, pointed at the local REST catalog and MinIO.
# This is the local stand-in for "a SQL engine over Iceberg" — the warehouse
# shape etl-craft supports for Databricks, Snowflake and Trino in production.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
# MinIO serves buckets as a path, not a subdomain.
s3.path-style-access=true
