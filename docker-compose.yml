services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: etl_craft
      POSTGRES_PASSWORD: etl_craft
      POSTGRES_DB: etl_craft
    ports:
      # Host port 55432 (not 5432) so this doesn't collide with a Postgres
      # already running on the dev machine.
      - "55432:5432"
    volumes:
      # postgres's own entrypoint runs every .sql file here, in name order,
      # but only against a freshly initialized (empty) data directory — so
      # schema.sql applies once, on first `up`, not on every restart.
      - ./src/etl_craft/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Mounted separately (not under initdb.d) since schema_test.sql is a
      # standalone smoke test meant to be run on demand against a disposable
      # database (see its own header) — not part of container startup.
      - ./src/etl_craft/sql:/sql:ro
      - etl_craft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_craft -d etl_craft"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------------------
  # A complete local Iceberg warehouse: MinIO for storage, an Iceberg REST
  # catalog, and Trino as the SQL engine over both.
  #
  # [ADDITION, 2026-09-22] This exists to close a stated gap: the Iceberg
  # execution path had no reachable engine to run against, so it was tested
  # only for well-formed SQL. Databricks and Snowflake both need a cloud
  # account, and Snowflake specifically cannot use MinIO at all -- its
  # external volumes are read by Snowflake's own cloud service, so the bucket
  # must be reachable from the public internet with real S3/Azure/GCS
  # credentials. Trino + REST + MinIO runs entirely locally and in CI, and
  # exercises the same code path.
  # ---------------------------------------------------------------------------
  minio:
    # quay.io, not Docker Hub: minio/minio there is no longer publicly pullable.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Offset like Postgres's 55432, to avoid colliding with anything local.
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Creates the bucket the catalog writes into, then exits.
  minio-init:
    image: quay.io/minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket ready'"
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "58181:8181"
    healthcheck:
      # /v1/config is the REST catalog spec's own readiness endpoint; it needs
      # the warehouse parameter the clients send.
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8181/v1/config?warehouse=s3://warehouse/' >/dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  trino:
    image: trinodb/trino:latest
    depends_on:
      iceberg-rest:
        condition: service_healthy
    ports:
      - "58080:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  etl_craft_pgdata:
