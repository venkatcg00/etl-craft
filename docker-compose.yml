services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: etl_craft
      POSTGRES_PASSWORD: etl_craft
      POSTGRES_DB: etl_craft
    ports:
      # Host port 55432 (not 5432) so this doesn't collide with a Postgres
      # already running on the dev machine.
      - "55432:5432"
    volumes:
      # postgres's own entrypoint runs every .sql file here, in name order,
      # but only against a freshly initialized (empty) data directory — so
      # schema.sql applies once, on first `up`, not on every restart.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Mounted separately (not under initdb.d) since schema_test.sql is a
      # standalone smoke test meant to be run on demand against a disposable
      # database (see its own header) — not part of container startup.
      - ./sql:/sql:ro
      - etl_craft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_craft -d etl_craft"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  etl_craft_pgdata:
