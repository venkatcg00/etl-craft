# The services the integration, end-to-end and connection suites use. Start them with
# `make services-up` (which first generates the test certificates) and stop them with
# `make services-down`. Nothing is kept in volumes: every `up` after a `down` starts empty.
#
# Host ports are offset (55432, 58080, ...) so they don't collide with services already
# running on a development machine. tests/fixtures/services.py lists them.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: etl_craft
      POSTGRES_PASSWORD: etl_craft
      POSTGRES_DB: etl_craft
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_craft -d etl_craft"]
      interval: 2s
      timeout: 3s
      retries: 30

  # PostgreSQL that accepts only TLS connections authenticated by a client certificate,
  # for the key_file authentication mode. The certificates come from
  # scripts/make_test_certs.sh.
  postgres-tls:
    image: postgres:16
    entrypoint: ["/bin/bash", "/usr/local/bin/start-tls.sh"]
    environment:
      POSTGRES_USER: etl_craft
      POSTGRES_PASSWORD: etl_craft
      POSTGRES_DB: etl_craft
    ports:
      - "55433:5432"
    volumes:
      - ./.certs:/certs:ro
      - ./docker/postgres-tls/start.sh:/usr/local/bin/start-tls.sh:ro
      - ./docker/postgres-tls/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_craft -d etl_craft"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Object storage for the Iceberg warehouse.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Creates the bucket the Iceberg catalog writes into, then exits.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/warehouse
    restart: "no"

  # An Iceberg REST catalog storing table data in MinIO.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "58181:8181"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:8181/v1/config?warehouse=s3://warehouse/' >/dev/null
      interval: 3s
      timeout: 5s
      retries: 30

  # Trino over the Iceberg catalog: the local stand-in for a SQL engine over Iceberg.
  trino:
    image: trinodb/trino:483
    depends_on:
      iceberg-rest:
        condition: service_healthy
    ports:
      - "58080:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      timeout: 5s
      retries: 60

  # An SMTP relay that keeps every message and serves them over an HTTP API. It accepts
  # any login, so both unauthenticated and password sends can be tested.
  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "51025:1025"
      - "58025:8025"
