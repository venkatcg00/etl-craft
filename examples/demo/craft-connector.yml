# Support Insights demo: an Engine DB in a SQLite file and a DuckDB warehouse beside this file,
# with alerts sent to a local Mailpit (make services-up starts one on port 51025).
#
# Each setting is marked `# variable` or `# value`. A variable is looked up in the secrets
# source (here: the process environment); when it is not set, the text itself is used.

Secrets:
  Source_type: ENVIRONMENT             # value

Orchestration:
  # Api_address: 127.0.0.1:8730  # all-in-one API; controller --no-ui exposes only /health
  Retry_on: TRANSIENT                 # value; retry only failures that can succeed
  Task_timeout_seconds: 600            # value
  Enforce_sla: true                    # value — email the pipeline's EMAIL_RECIPIENTS on an SLA miss
  Email:
    Host: localhost                    # value
    Port: 51025                        # value — Mailpit's SMTP port
    From_address: etl-craft@example.com  # value
    From_name: Support Insights        # value
    Tls_mode: NONE                     # value

Engine:
  dev:
    Jdbc_url: jdbc:sqlite:engine.db    # value — created beside this file
    Schema: main                       # value

Warehouse:
  Name: DuckDB                         # value
  dev:
    Jdbc_url: jdbc:duckdb:warehouse.duckdb  # value — beside this file
    Schema: aud                        # value — where cloning copies the Engine DB tables

Cloning:
  dev:
    Enabled: true                      # value
    Scope: ALL                         # value

Docs_site:
  dev:
    Schedule: "0 2 * * *"              # value — the controller rebuilds the catalog nightly

Auth:
  Session_hours: 12                     # value — run setup and login before operating the demo

# SSO deployments may set Auth.Oidc_groups_claim: groups beside Oidc_issuer and Oidc_client_id.
# Sessions and admitted runs retain group IDs; current account/group/grant restrictions apply.
