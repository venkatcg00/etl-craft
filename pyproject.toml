[project]
name = "etl-craft"
version = "0.1.0.dev0"
description = "Metadata-driven ETL orchestration engine"
readme = "README.md"
authors = [{ name = "venkatcg00", email = "venkatcg0@gmail.com" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["etl", "orchestration", "metadata-driven", "data-engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "duckdb-engine>=0.13",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
etl-craft = "etl_craft.cli:main"

[project.urls]
Homepage = "https://github.com/venkatcg00/etl-craft"
Repository = "https://github.com/venkatcg00/etl-craft"
Issues = "https://github.com/venkatcg00/etl-craft/issues"

[project.optional-dependencies]
aws = [
    "boto3>=1.28",
]
databricks = [
    "databricks-sqlalchemy>=2",
]
snowflake = [
    "snowflake-sqlalchemy>=1.7",
]
trino = [
    "trino[sqlalchemy]>=0.330",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["src/etl_craft/py.typed"]

[tool.uv.sources]
etl-craft = { workspace = true }

[dependency-groups]
dev = [
    "etl-craft[aws,databricks,snowflake,trino]",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pre-commit>=4",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12",
]
docs = [
    "mike>=2.2",
    "mkdocs>=1.6.1,<2",
    "mkdocs-gen-files>=0.6",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "B",       # bugbear
    "C4",      # comprehensions
    "D",       # docstrings
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "PLW1514", # open() without an explicit encoding
    "RUF",     # ruff-specific
    "SIM",     # simplifications
    "UP",      # pyupgrade
    "W",       # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D100", "D103"]

[tool.mypy]
python_version = "3.11"
files = ["src/etl_craft", "scripts"]
strict = true
warn_unreachable = true

# boto3 is the one optional import (auth_mode sts) and ships no type information.
[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
timeout = 120
markers = [
    "unit: pure Python, no services",
    "engine_sqlite: Engine DB on SQLite",
    "engine_postgres: Engine DB on PostgreSQL",
    "warehouse_postgres: PostgreSQL warehouse",
    "warehouse_duckdb: DuckDB warehouse",
    "warehouse_duckdb_iceberg: DuckDB over the local Iceberg REST catalog",
    "warehouse_trino_iceberg: Trino over the local Iceberg REST catalog",
    "connections: every resource with every locally verifiable authentication mode",
    "e2e_pip: the demo project, run from the wheel installed with pip",
    "e2e_uv: the demo project, run from the wheel installed with uv pip",
    "package: the built wheel and sdist",
    "docs: the documentation site",
    "cloud_databricks: Databricks, run locally with credentials",
    "cloud_snowflake: Snowflake, run locally with credentials",
    "harness: the local test services themselves",
]

[tool.coverage.run]
source = ["etl_craft"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "etl_craft"

[[tool.importlinter.contracts]]
name = "Layers: each layer imports only the layers below it"
type = "layers"
layers = [
    "etl_craft.cli",
    "etl_craft.services",
    "etl_craft.execution",
    "etl_craft.handlers",
    "etl_craft.engine | etl_craft.warehouse",
    "etl_craft.dialects",
    "etl_craft.config",
    "etl_craft.core",
]
