[project]
name = "etl-craft"
version = "0.1.0"
description = "Standalone, metadata-driven ETL orchestration engine"
readme = "README.md"
authors = [
    { name = "venkatcg00", email = "venkatcg0@gmail.com" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["etl", "orchestration", "metadata-driven", "data-engineering", "airflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    # [DEVIATION, 2026-09-20] CLAUDE.md's Non-goals ruled out a SQL parser
    # dependency, and E2-07/E2-25 deliberately used lint-grade string checks
    # instead. Reversed by explicit instruction, to get column-level lineage:
    # "dont re-invent the wheel use metadata and any existing package that can
    # do this", and "if it is easy implement our own, else go with hard
    # dependency, our product should ship with it". Writing our own is not
    # easy — sqlglot is tens of thousands of lines across 20+ dialects, and a
    # hand-rolled parser would get column resolution wrong in exactly the
    # cases lineage exists for. sqlglot itself has zero dependencies, so this
    # adds one package and nothing transitive.
    "sqlglot>=27",
    "sqlalchemy>=2.0.54",
    # [DEVIATION, 2026-09-20] A SQLAlchemy dialect as a hard dependency, which
    # Non-goals rules out in general. Scoped reversal, per explicit decision:
    # "DuckDB is our warehouse now ... duckdb and postgresql are the ones we
    # want to majorly support". DuckDB is embedded — there is no server to
    # stand up — so shipping it is what makes `etl-craft setup` reach a working
    # warehouse with no extra step, which is the whole point of the dbt-route
    # setup. Other dialects stay exactly as they were: optional extras a team
    # installs itself, discovered through SQLAlchemy's entry points, never
    # imported by engine code.
    "duckdb-engine>=0.13",
]

# [ADDITION, 2026-09-22] The warehouse dialects this engine is built for, as
# optional extras a team installs for the one it uses. Per explicit decision:
# "engine: always postgres / warehouse: postgres (pg analytics), databricks
# with iceberg unity catalog, snowflake with iceberg hybrid tables, maybe be
# trino with iceberg or any sql tool over plain iceberg."
#
# They stay *extras*, not hard dependencies, exactly as Non-goals requires:
# engine code never imports any of them. SQLAlchemy discovers whichever one is
# installed through its own entry points, and warehouse.py reaches it through
# the resolved dialect alone (see _dbapi_connect). The last entry is the point
# of the design — "any sql tool over plain iceberg" needs no code here at all,
# only a dialect on the path.
[project.optional-dependencies]
databricks = ["databricks-sqlalchemy>=2"]
snowflake = ["snowflake-sqlalchemy>=1.7"]
trino = ["trino[sqlalchemy]>=0.330"]

[project.scripts]
etl-craft = "etl_craft:main"

[project.urls]
Homepage = "https://github.com/venkatcg00/etl-craft"
Repository = "https://github.com/venkatcg00/etl-craft"
Issues = "https://github.com/venkatcg00/etl-craft/issues"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# [ADDITION, 2026-09-20, E2-13] The built wheel shipped 24 .py files and
# nothing else — no sql/, no py.typed, no license. There was therefore no way
# to create the Engine DB from an installed package at all (schema.sql existed
# only in the git checkout), and `etl-craft migrate` silently no-opped against
# a directory that does not exist. uv_build packages src/<module>/ only, which
# is why sql/ moved under src/etl_craft/ rather than being included from the
# repo root.
# [DEVIATION, 2026-09-24] Each Engine DB dialect now owns its schema.sql and
# migrations/ under dialects/engine_dialects/<dialect>/, so that tree ships.
[tool.uv.build-backend]
source-include = [
    "src/etl_craft/dialects/**",
    "src/etl_craft/vendor/**",
    "src/etl_craft/py.typed",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12",
    "pydocstyle>=6.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
    # Self-referential, so this repo's own suite can verify each dialect
    # genuinely resolves through SQLAlchemy's entry points — the same shape
    # the ClickHouse extra used, and the reason that resolution was proven
    # rather than assumed.
    "etl-craft[databricks,snowflake,trino]",
]

[tool.pytest.ini_options]
# The orchestrator tests spawn real subprocesses in a wave loop — a bug
# there (e.g. re-selecting a permanently-FAILED task forever) hangs, not
# fails, so a global timeout turns that into a fast, legible test failure
# instead of a stuck CI job or a stuck local dev shell.
timeout = 60

[tool.coverage.run]
source = ["etl_craft"]
# "thread": without this, coverage.py only traces the main thread by
# default, so the race-branch code in runlog.py's real concurrency test
# (multiple threads hitting the same partial unique index) silently reads
# as uncovered even though it genuinely runs.
# "multiprocessing": runner.py's crash-detection fork (a real
# multiprocessing.Process, not a same-thread call) needs this too, plus
# `parallel = true` below so each forked child writes its own data file
# instead of racing the parent's — pytest-cov combines them automatically
# at session end.
concurrency = ["thread", "multiprocessing"]
parallel = true

[tool.coverage.report]
# [DEVIATION, 2026-09-19] Relaxed from 100 per explicit instruction — write
# high-quality tests for genuinely new behavior, not exhaustive line-hunting
# to keep a 100% gate green. Existing tests stay as-is; this only changes
# how hard future additions must chase the last few percent.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
]

# [ADDITION, 2026-09-20, E2-29] Every module uses `from __future__ import
# annotations` and complete signatures, and nothing checked them. Not
# --strict: the goal is to catch real defects (the split(".", 1) unpacking
# hazard, untyped config values) rather than to spend the iteration annotating
# test helpers and third-party seams. Tests are excluded for the same reason —
# they are exercised by running them.
[tool.mypy]
python_version = "3.11"
files = ["src/etl_craft"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# No per-module overrides: third-party dialects are never imported directly
# (CLAUDE.md's Non-goals), so there is nothing to ignore.

[tool.pydocstyle]
select = "D"
# D203/D211 and D212/D213 are each an inherently contradictory pair under a
# bare "select=D" (whichever style is used, the other rule in the pair always
# fires) — add-ignore drops one side of each, same resolution pydocstyle's
# own "pep257" convention uses.
add-ignore = "D203,D213"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# D (docstrings) is deliberately left out of ruff's own selection — pydocstyle
# above is the dedicated tool for that, so the two don't produce duplicate or
# conflicting reports on the same lines.
#
# PLW1514 (unspecified-encoding) is added for E2-76: every read/write in the
# package used the process's locale encoding, so `init-db` and `setup` — the
# first two commands a new adopter runs — died with a UnicodeDecodeError on
# any non-UTF-8 locale, because schema.sql's own comments contain em-dashes.
# Invisible from a developer checkout under a developer's locale, so a lint
# rule is what holds the line rather than a test. It needs `preview` to run;
# explicit-preview-rules keeps that to this one rule, so enabling it does not
# also pull in every other preview rule in the selected categories.
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "UP", "B", "SIM", "PLW1514"]

[tool.ruff.format]

# Ruff's formatter is not used — black owns formatting so there's a single
# source of truth; `ruff` here is lint-only (see [tool.ruff.lint] above).
