[project]
name = "etl-craft"
version = "0.3.0"
description = "Metadata-driven ETL orchestration engine"
readme = "README.md"
authors = [{ name = "venkatcg00", email = "venkatcg0@gmail.com" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["etl", "orchestration", "metadata-driven", "data-engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "psutil>=6.0",
    "duckdb-engine>=0.13",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
    "sqlglot>=26",
    "watchdog>=6",
]

[project.scripts]
etl-craft = "etl_craft.cli:main"

[project.urls]
Homepage = "https://github.com/venkatcg00/etl-craft"
Repository = "https://github.com/venkatcg00/etl-craft"
Issues = "https://github.com/venkatcg00/etl-craft/issues"

[project.optional-dependencies]
ui = ["fastapi>=0.115", "pydantic>=2", "uvicorn>=0.35", "jinja2>=3.1"]
all = ["etl-craft[ui,aws,databricks,snowflake,trino]"]
aws = [
    "boto3>=1.28",
]
databricks = [
    "databricks-sqlalchemy>=2",
    "databricks-sql-connector>=4.5.0",
    # databricks-sql-connector's rows are not the tuples SQLAlchemy 2.1 requires.
    "sqlalchemy>=2.0.54,<2.1",
]
publish = [
    "ngrok>=1.4",
]
snowflake = [
    "snowflake-sqlalchemy>=1.7",
]
trino = [
    "trino[sqlalchemy]>=0.330",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["src/etl_craft/py.typed"]

[tool.uv.sources]
etl-craft = { workspace = true }

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "etl-craft[aws,databricks,ui,snowflake,trino]",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pre-commit>=4",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-xdist==3.8.0",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    "ruff>=0.16.8",
    "types-psutil>=6.0",
    "types-pyyaml>=6.0.12",
]
docs = [
    "etl-craft[ui]",
    "mike>=2.2",
    "mkdocs>=1.6.1,<2",
    "mkdocs-gen-files>=0.6",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "B",       # bugbear
    "C4",      # comprehensions
    "D",       # docstrings
    "DTZ",     # timezone-aware datetimes
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "PGH",     # specific type: ignore and noqa codes
    "PLW1514", # open() without an explicit encoding
    "RUF",     # ruff-specific
    "SIM",     # simplifications
    "T20",     # print outside the command-line output layer
    "UP",      # pyupgrade
    "W",       # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# Limits for the complexity rules (C901, PLR0912, PLR0913, PLR0915). They are not in `select`:
# scripts/check_quality.py runs them over src/etl_craft and holds the existing offenders to
# scripts/quality-baseline.json, so new code cannot cross a limit and old code cannot get worse.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DTZ", "T20"]
"integrations/**/tests/**" = ["D", "DTZ"]
"scripts/**" = ["D100", "D103", "T20"]
# The demo scripts print progress and keep naive offset timestamps, as user scripts may.
"examples/**" = ["DTZ", "T20"]
"src/etl_craft/cli/output.py" = ["T20"]
# Cron matching builds naive wall-clock times and attaches the zone itself.
"src/etl_craft/core/cron.py" = ["DTZ001"]

[tool.mypy]
python_version = "3.11"
files = ["src/etl_craft", "scripts"]
strict = true
warn_unreachable = true

# boto3 is the one optional import (auth_mode sts) and ships no type information.
[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
timeout = 120
markers = [
    "unit: pure Python, no services",
    "engine_sqlite: Engine DB on SQLite",
    "engine_postgres: Engine DB on PostgreSQL",
    "warehouse_postgres: PostgreSQL warehouse",
    "warehouse_duckdb: DuckDB warehouse",
    "warehouse_duckdb_iceberg: DuckDB over the local Iceberg REST catalog",
    "warehouse_trino_iceberg: Trino over the local Iceberg REST catalog",
    "connections: every resource with every locally verifiable authentication mode",
    "e2e_pip: the demo project, run from the wheel installed with pip",
    "e2e_uv: the demo project, run from the wheel installed with uv pip",
    "package: the built wheel and sdist",
    "docs: the documentation site",
    "cloud_databricks: Databricks, run locally with credentials",
    "cloud_snowflake: Snowflake, run locally with credentials",
    "harness: the local test services themselves",
    "chaos: concurrent execution, process loss and recovery",
]

[tool.coverage.run]
source = ["etl_craft"]
branch = true
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "etl_craft"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: each layer imports only the layers below it"
type = "layers"
layers = [
    "etl_craft.cli",
    "etl_craft.api",
    "etl_craft.controller | etl_craft.agent",
    "etl_craft.services",
    "etl_craft.execution",
    "etl_craft.handlers",
    "etl_craft.scripting",
    "etl_craft.engine | etl_craft.warehouse",
    "etl_craft.dialects",
    "etl_craft.config",
    "etl_craft.core",
]

[[tool.importlinter.contracts]]
name = "Interfaces call actions through etl_craft.services.operations, the one implementation"
type = "forbidden"
source_modules = ["etl_craft.cli", "etl_craft.api"]
forbidden_modules = ["etl_craft.services.*"]
allow_indirect_imports = true
ignore_imports = [
    "etl_craft.cli.** -> etl_craft.services.operations",
    "etl_craft.cli.** -> etl_craft.services.operations.**",
    "etl_craft.api.** -> etl_craft.services.operations",
    "etl_craft.api.** -> etl_craft.services.operations.**",
    # The person's own credential file belongs to the CLI, not to an action.
    "etl_craft.cli.** -> etl_craft.services.credentials",
    # Result types the CLI renders.
    "etl_craft.cli.commands.doctor -> etl_craft.services.doctor",
    "etl_craft.cli.commands.validate -> etl_craft.services.doctor",
    "etl_craft.cli.commands.lineage -> etl_craft.services.lineage",
    "etl_craft.cli.commands.config -> etl_craft.services.config_files",
    # A long-running process the interface starts and stops, like `controller`.
    "etl_craft.cli.commands.publish_docs -> etl_craft.services.docs_publish",
]

[[tool.importlinter.contracts]]
name = "The ui extra (FastAPI, Pydantic, uvicorn, Jinja2) is imported only by etl_craft.api"
type = "forbidden"
source_modules = [
    "etl_craft.cli",
    "etl_craft.controller",
    "etl_craft.services",
    "etl_craft.execution",
    "etl_craft.handlers",
    "etl_craft.scripting",
    "etl_craft.engine",
    "etl_craft.warehouse",
    "etl_craft.dialects",
    "etl_craft.config",
    "etl_craft.core",
]
forbidden_modules = ["fastapi", "pydantic", "uvicorn", "jinja2"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The aws extra (boto3) is imported only by etl_craft.dialects.credentials"
type = "forbidden"
source_modules = ["etl_craft"]
forbidden_modules = ["boto3", "botocore"]
ignore_imports = ["etl_craft.dialects.credentials -> boto3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Engine code never imports a third-party warehouse dialect"
type = "forbidden"
source_modules = ["etl_craft"]
forbidden_modules = ["snowflake", "databricks", "trino"]
allow_indirect_imports = true
