# Warehouse: Snowflake, native tables.
#
# The tested connection shape: separate fields plus a Programmatic Access Token.
# warehouse-snowflake-key-pair.yml shows RSA key-pair auth instead.
#
# Each setting is marked `# variable` or `# value`. A variable is looked up in
# the secrets source (here: the process environment); when it is not set, the
# text itself is used, so `Profile: dev` is simply dev. A secret must always
# be a variable that is set. `etl-craft doctor` lists every value used as
# written that looks like a variable name.
#
# Complete and loadable as written: tests/unit/test_config_examples.py loads every
# file in this directory, for every profile it declares.

Secrets:
  Source_type: environment             # value — variables below are read from the process environment
  Profile: ETL_CRAFT_PROFILE           # variable — dev | sit | uat | prod, set in each environment

Orchestration:
  Task_timeout_seconds: 21600          # value
  Max_parallel_tasks: 8                # value
  Enforce_sla: false                   # value — true: email when a run misses its SLA_IN_HOURS
  dev:
    Retries: 1                         # value
  sit:
    Retries: 1                         # value
    Email:
      host: EMAIL_HOST                 # variable
      port: EMAIL_PORT                 # variable
      from_address: EMAIL_FROM         # variable
      auth_mode: EMAIL_AUTH_MODE       # variable
      user: EMAIL_USER                 # variable
      tls_mode: EMAIL_TLS_MODE         # variable — starttls | ssl | none
      secret: EMAIL_SECRET             # variable, required: a secret is never used as written
  uat:
    Retries: 1                         # value
    Email:
      host: EMAIL_HOST                 # variable
      port: EMAIL_PORT                 # variable
      from_address: EMAIL_FROM         # variable
      auth_mode: EMAIL_AUTH_MODE       # variable
      user: EMAIL_USER                 # variable
      tls_mode: EMAIL_TLS_MODE         # variable — starttls | ssl | none
      secret: EMAIL_SECRET             # variable, required: a secret is never used as written
  prod:
    Retries: 1                         # value
    Email_recipients: [data-alerts@example.com]  # value
    Email:
      host: EMAIL_HOST                 # variable
      port: EMAIL_PORT                 # variable
      from_address: EMAIL_FROM         # variable
      auth_mode: EMAIL_AUTH_MODE       # variable
      user: EMAIL_USER                 # variable
      tls_mode: EMAIL_TLS_MODE         # variable — starttls | ssl | none
      secret: EMAIL_SECRET             # variable, required: a secret is never used as written

Engine:
  Name: Postgres                       # value
  dev:
    jdbc_url: ENGINE_JDBC_URL          # variable
    schema: etl_craft                  # value — must already exist; the engine never creates it
    user: ENGINE_USER                  # variable
    auth_mode: ENGINE_AUTH_MODE        # variable
    secret: ENGINE_SECRET              # variable, required: a secret is never used as written
  sit:
    jdbc_url: ENGINE_JDBC_URL          # variable
    schema: etl_craft                  # value — must already exist; the engine never creates it
    user: ENGINE_USER                  # variable
    auth_mode: ENGINE_AUTH_MODE        # variable
    secret: ENGINE_SECRET              # variable, required: a secret is never used as written
  uat:
    jdbc_url: ENGINE_JDBC_URL          # variable
    schema: etl_craft                  # value — must already exist; the engine never creates it
    user: ENGINE_USER                  # variable
    auth_mode: ENGINE_AUTH_MODE        # variable
    secret: ENGINE_SECRET              # variable, required: a secret is never used as written
  prod:
    jdbc_url: ENGINE_JDBC_URL          # variable
    schema: etl_craft                  # value — must already exist; the engine never creates it
    user: ENGINE_USER                  # variable
    auth_mode: ENGINE_AUTH_MODE        # variable
    secret: ENGINE_SECRET              # variable, required: a secret is never used as written

Warehouse:
  Name: Snowflake                      # value
  Table_format: native                 # value
  dev:
    user: WAREHOUSE_USER               # variable
    account: WAREHOUSE_ACCOUNT         # variable — <org>-<account>, not a hostname
    database: WAREHOUSE_DATABASE       # variable
    schema: WAREHOUSE_SCHEMA           # variable
    warehouse: WAREHOUSE_WAREHOUSE     # variable
    role: WAREHOUSE_ROLE               # variable
    token: WAREHOUSE_TOKEN             # variable, required: a secret is never used as written — a Programmatic Access Token (needs a network policy)
  sit:
    user: WAREHOUSE_USER               # variable
    account: WAREHOUSE_ACCOUNT         # variable — <org>-<account>, not a hostname
    database: WAREHOUSE_DATABASE       # variable
    schema: WAREHOUSE_SCHEMA           # variable
    warehouse: WAREHOUSE_WAREHOUSE     # variable
    role: WAREHOUSE_ROLE               # variable
    token: WAREHOUSE_TOKEN             # variable, required: a secret is never used as written — a Programmatic Access Token (needs a network policy)
  uat:
    user: WAREHOUSE_USER               # variable
    account: WAREHOUSE_ACCOUNT         # variable — <org>-<account>, not a hostname
    database: WAREHOUSE_DATABASE       # variable
    schema: WAREHOUSE_SCHEMA           # variable
    warehouse: WAREHOUSE_WAREHOUSE     # variable
    role: WAREHOUSE_ROLE               # variable
    token: WAREHOUSE_TOKEN             # variable, required: a secret is never used as written — a Programmatic Access Token (needs a network policy)
  prod:
    user: WAREHOUSE_USER               # variable
    account: WAREHOUSE_ACCOUNT         # variable — <org>-<account>, not a hostname
    database: WAREHOUSE_DATABASE       # variable
    schema: WAREHOUSE_SCHEMA           # variable
    warehouse: WAREHOUSE_WAREHOUSE     # variable
    role: WAREHOUSE_ROLE               # variable
    token: WAREHOUSE_TOKEN             # variable, required: a secret is never used as written — a Programmatic Access Token (needs a network policy)
