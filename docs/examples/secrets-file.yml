# Secrets from a .env-style file.
#
# The names below are looked up in the file Secrets.Path points at, resolved
# relative to this file (not the working directory), so every spawned task
# reads the same one. The file's name can be anything; secrets-file.env beside
# this one shows the format. Keep the real one out of version control.
#
# Complete and loadable as written: tests/test_config_examples.py loads every
# file in this directory, for every profile it declares.

Secrets:
  Source_type: file
  Path: secrets-file.env          # KEY=VALUE per line, '#' comments
  Profile: dev

Orchestration:
  Mode: local
  Task_timeout_seconds: 21600
  Max_parallel_tasks: 8
  Enforce_sla: false

Engine:
  Name: Postgres
  dev:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET
  sit:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET
  uat:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET
  prod:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET

Warehouse:
  Name: Postgres
  Table_format: native
  dev:
    jdbc_url: WAREHOUSE_JDBC_URL
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE
    secret: WAREHOUSE_SECRET
  sit:
    jdbc_url: WAREHOUSE_JDBC_URL
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE
    secret: WAREHOUSE_SECRET
  uat:
    jdbc_url: WAREHOUSE_JDBC_URL
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE
    secret: WAREHOUSE_SECRET
  prod:
    jdbc_url: WAREHOUSE_JDBC_URL
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE
    secret: WAREHOUSE_SECRET
