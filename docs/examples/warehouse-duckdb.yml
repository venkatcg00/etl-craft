# Warehouse on a DuckDB file — local development.
#
# Embedded: no server and nothing to authenticate. DuckDB admits one writing
# process at a time, so etl-craft queues warehouse access behind an Engine DB
# lock. The file stem is the catalog name, so keep it a plain identifier.
#
# Complete and loadable as written: tests/test_config_examples.py loads every
# file in this directory, for every profile it declares.

Secrets:
  Source_type: environment        # names below are read from the process environment
  Profile: dev                    # the default profile; ETL_CRAFT_PROFILE=prod switches all

Orchestration:
  Mode: remote                    # an orchestrator runs each task from generate-yml's DAGs
  Name: Airflow                   # informational only
  Task_timeout_seconds: 21600
  Max_parallel_tasks: 8
  Enforce_sla: false              # parsed but not yet enforced (docs/configuration.md)
  dev:
    Global_dag: false
    Catchup: false
    Tags: [analytics]
    Retries: 1
    Retry_delay_minutes: 5
    Depends_on_past: false
    Email_on_failure: false
    Allow_schedule: false
  sit:
    Global_dag: false
    Catchup: false
    Tags: [analytics]
    Retries: 1
    Retry_delay_minutes: 5
    Depends_on_past: false
    Email_on_failure: false
    Allow_schedule: false
    Email:
      host: EMAIL_HOST
      port: EMAIL_PORT
      from_address: EMAIL_FROM
      auth_mode: EMAIL_AUTH_MODE
      user: EMAIL_USER
      use_tls: EMAIL_USE_TLS
      secret: EMAIL_SECRET
  uat:
    Global_dag: false
    Catchup: false
    Tags: [analytics]
    Retries: 1
    Retry_delay_minutes: 5
    Depends_on_past: false
    Email_on_failure: false
    Allow_schedule: false
    Email:
      host: EMAIL_HOST
      port: EMAIL_PORT
      from_address: EMAIL_FROM
      auth_mode: EMAIL_AUTH_MODE
      user: EMAIL_USER
      use_tls: EMAIL_USE_TLS
      secret: EMAIL_SECRET
  prod:
    Global_dag: true
    Catchup: false
    Tags: [analytics]
    Retries: 1
    Retry_delay_minutes: 5
    Depends_on_past: false
    Email_on_failure: true
    Allow_schedule: true
    Email_recipients: [data-alerts@example.com]
    Email:
      host: EMAIL_HOST
      port: EMAIL_PORT
      from_address: EMAIL_FROM
      auth_mode: EMAIL_AUTH_MODE
      user: EMAIL_USER
      use_tls: EMAIL_USE_TLS
      secret: EMAIL_SECRET

Engine:
  Name: SQLite
  dev:
    jdbc_url: jdbc:sqlite:etl-craft-engine-dev.db
  sit:
    jdbc_url: jdbc:sqlite:etl-craft-engine-sit.db
  uat:
    jdbc_url: jdbc:sqlite:etl-craft-engine-uat.db
  prod:
    jdbc_url: jdbc:sqlite:etl-craft-engine-prod.db

Warehouse:
  Name: DuckDB
  Table_format: native
  dev:
    jdbc_url: jdbc:duckdb:warehouse_dev.duckdb
  sit:
    jdbc_url: jdbc:duckdb:warehouse_sit.duckdb
  uat:
    jdbc_url: jdbc:duckdb:warehouse_uat.duckdb
  prod:
    jdbc_url: jdbc:duckdb:warehouse_prod.duckdb
