# Warehouse: Snowflake with RSA key-pair auth (one JDBC URL).
#
# The alternative to a token, for a team standardised on key pairs.
# WAREHOUSE_KEY_FILE is the private key's path and WAREHOUSE_SECRET its
# passphrase. auth_mode password (with the password in WAREHOUSE_SECRET and no
# key_file) also works on this shape.
#
# Complete and loadable as written: tests/test_config_examples.py loads every
# file in this directory, for every profile it declares.

Secrets:
  Source_type: environment        # names below are read from the process environment
  Profile: dev                    # the default profile; ETL_CRAFT_PROFILE=prod switches all

Orchestration:
  Mode: remote                    # an orchestrator runs each task from generate-yml's DAGs
  Name: Airflow                   # informational only
  Task_timeout_seconds: 21600
  Max_parallel_tasks: 8
  Enforce_sla: false              # parsed but not yet enforced (docs/configuration.md)
  dev:
    Global_dag: false
    Catchup: false
    Tags: [analytics]
    Retries: 1
    Retry_delay_minutes: 5
    Depends_on_past: false
    Email_on_failure: false
    Allow_schedule: false
  sit:
    Global_dag: false
    Catchup: false
    Tags: [analytics]
    Retries: 1
    Retry_delay_minutes: 5
    Depends_on_past: false
    Email_on_failure: false
    Allow_schedule: false
    Email:
      host: EMAIL_HOST
      port: EMAIL_PORT
      from_address: EMAIL_FROM
      auth_mode: EMAIL_AUTH_MODE
      user: EMAIL_USER
      use_tls: EMAIL_USE_TLS
      secret: EMAIL_SECRET
  uat:
    Global_dag: false
    Catchup: false
    Tags: [analytics]
    Retries: 1
    Retry_delay_minutes: 5
    Depends_on_past: false
    Email_on_failure: false
    Allow_schedule: false
    Email:
      host: EMAIL_HOST
      port: EMAIL_PORT
      from_address: EMAIL_FROM
      auth_mode: EMAIL_AUTH_MODE
      user: EMAIL_USER
      use_tls: EMAIL_USE_TLS
      secret: EMAIL_SECRET
  prod:
    Global_dag: true
    Catchup: false
    Tags: [analytics]
    Retries: 1
    Retry_delay_minutes: 5
    Depends_on_past: false
    Email_on_failure: true
    Allow_schedule: true
    Email_recipients: [data-alerts@example.com]
    Email:
      host: EMAIL_HOST
      port: EMAIL_PORT
      from_address: EMAIL_FROM
      auth_mode: EMAIL_AUTH_MODE
      user: EMAIL_USER
      use_tls: EMAIL_USE_TLS
      secret: EMAIL_SECRET

Engine:
  Name: Postgres
  dev:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET
  sit:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET
  uat:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET
  prod:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET

Warehouse:
  Name: Snowflake
  Table_format: native
  dev:
    jdbc_url: WAREHOUSE_JDBC_URL    # jdbc:snowflake://<account>.snowflakecomputing.com/?db=<db>&schema=<schema>&warehouse=<wh>&role=<role>
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE  # key_file | password
    key_file: WAREHOUSE_KEY_FILE
    secret: WAREHOUSE_SECRET
  sit:
    jdbc_url: WAREHOUSE_JDBC_URL    # jdbc:snowflake://<account>.snowflakecomputing.com/?db=<db>&schema=<schema>&warehouse=<wh>&role=<role>
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE  # key_file | password
    key_file: WAREHOUSE_KEY_FILE
    secret: WAREHOUSE_SECRET
  uat:
    jdbc_url: WAREHOUSE_JDBC_URL    # jdbc:snowflake://<account>.snowflakecomputing.com/?db=<db>&schema=<schema>&warehouse=<wh>&role=<role>
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE  # key_file | password
    key_file: WAREHOUSE_KEY_FILE
    secret: WAREHOUSE_SECRET
  prod:
    jdbc_url: WAREHOUSE_JDBC_URL    # jdbc:snowflake://<account>.snowflakecomputing.com/?db=<db>&schema=<schema>&warehouse=<wh>&role=<role>
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE  # key_file | password
    key_file: WAREHOUSE_KEY_FILE
    secret: WAREHOUSE_SECRET
