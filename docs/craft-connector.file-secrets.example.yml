# =============================================================================
# craft-connector.yml — secrets read from a .env-style FILE
# =============================================================================
#
# The one rule that governs this whole file:
#
#     EVERY VALUE UNDER Variables IS THE *NAME* OF A VARIABLE, NEVER THE VALUE.
#
# `jdbc_url: ENGINE_JDBC_URL` does not mean the URL is the literal string
# "ENGINE_JDBC_URL". It means: look up ENGINE_JDBC_URL in whatever
# Secrets.Source_type points at, and use what you find there.
#
# That is what makes this file safe to commit: it contains no hostnames, no
# usernames, no URLs and no credentials — only a map of where to find them.
# The same file works unchanged in dev, CI and prod; only the variables differ.
#
# There is deliberately no exception for "non-secret" fields like auth_mode.
# One rule, applied everywhere, beats a rule with a carve-out someone has to
# remember — and beats a loader guessing whether a value is a value or a name.
#
# -----------------------------------------------------------------------------
# The variable names carry NO environment tier
# -----------------------------------------------------------------------------
# There is one set of names per section: ENGINE_JDBC_URL, not
# ENGINE_DEV_JDBC_URL / ENGINE_SIT_JDBC_URL / ENGINE_PROD_JDBC_URL. A tier in
# the name would say the same thing twice — `Profile` below already says which
# tier this deployment is — and the two can disagree. It would also mean the
# same container image needs a *different variable name* per environment,
# which defeats the point of overriding the profile at runtime.
#
# So: one name, and each environment gives it a different value.
#
# OPTIONAL, and only useful for one file holding several tiers at once (a
# laptop flipping between dev and uat without editing values): a tier-scoped
# name wins over the plain one when it is present. With Profile: dev, the
# engine reads ENGINE_DEV_JDBC_URL if it is set, and ENGINE_JDBC_URL if it is
# not. Nothing in this file mentions the suffix; it is purely a lookup
# fallback. In CI and containers, ignore it and set the plain names.
# -----------------------------------------------------------------------------

Orchestration:
  # local  = this machine is the scheduler (etl-craft run drives the waves)
  # remote = an orchestrator drives it; etl-craft only ever runs one task
  Mode: remote
  # Informational only. The engine never acts on it.
  Orchestrator_name: airflow

Secrets:
  Source_type: file
  # Every variable named below is looked up in this file.
  Source_path: /etc/etl-craft/.env

Engine:
  # Which tier this deployment is. Overridable at runtime without editing this
  # file: set ETL_CRAFT_ENGINE_PROFILE in the environment and it wins.
  #
  # It selects the tier, not the variable names — those never change.
  Profile: dev
  Variables:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET

Warehouse:
  # Postgres | Databricks | Snowflake | Trino. Checked against the dialect the
  # jdbc_url actually resolves to, so a Databricks URL filed under
  # Name: Snowflake is caught at setup rather than at 3am.
  Name: Postgres
  # iceberg | native. What format the engine creates tables in here.
  #   iceberg = readable by everything else in the lakehouse (the default)
  #   native  = the warehouse's own format: Delta on Databricks, a
  #             standard table on Snowflake
  # A single task can differ with CFG_TASK_PARAMETERS.TABLE_FORMAT.
  Table_format: iceberg
  # Overridable at runtime by ETL_CRAFT_WAREHOUSE_PROFILE.
  Profile: dev
  Variables:
    jdbc_url: WAREHOUSE_JDBC_URL
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE
    secret: WAREHOUSE_SECRET

# -----------------------------------------------------------------------------
# The same Warehouse section for each supported engine. Only the values behind
# the variables change — the names and the shape never do. That is exactly why
# the names carry no tier and no vendor.
#
# Databricks (Unity Catalog) — TESTED AND RECOMMENDED shape, verified live
# 2026-09-23 (CREATE_TABLE/OVERWRITE_TABLE/SCD1_MERGE, both Table_format:
# native and iceberg — see CLAUDE.md's "Where things stand"). auth_mode is
# always `token` here, and the engine assembles the connection from these
# four separate fields (warehouse.PREFERRED_CONNECTION_FIELDS) rather than
# one JDBC URL carrying catalog/schema embedded in its query string:
#   Name: Databricks
#   Variables:
#     jdbc_url: WAREHOUSE_JDBC_URL     # jdbc:databricks://<host>:443/default;
#                                      #   httpPath=/sql/1.0/warehouses/<id>
#                                      #   (no ConnCatalog/ConnSchema here —
#                                      #   those are the two fields below)
#     catalog: WAREHOUSE_CATALOG
#     schema: WAREHOUSE_SCHEMA
#     token: WAREHOUSE_TOKEN           # -> the personal access token
#     # no `user`: Databricks' username is the literal "token", set for you
#
# Snowflake — TESTED AND RECOMMENDED shape, verified live 2026-09-23
# (CREATE_TABLE/OVERWRITE_TABLE/SCD1_MERGE against a real account, both
# Table_format: native and iceberg — see CLAUDE.md's "Where things stand").
# Iceberg tables default to Snowflake's own internal storage
# (EXTERNAL_VOLUME = 'SNOWFLAKE_MANAGED'), so no cloud bucket has to exist
# first; a task can still declare its own EXTERNAL_VOLUME/BASE_LOCATION to
# use a customer-owned volume instead.
# auth_mode is always `token` — a Snowflake Programmatic Access Token (PAT),
# presented like a password — and the engine assembles the connection from
# these seven separate fields rather than one JDBC URL with the database,
# schema, warehouse and role packed into its query string. A PAT requires a
# network policy to be assigned to the account or the user first (Snowsight
# -> Admin -> Security -> Network Policies) — without one, every connection
# attempt fails with "Network policy is required", regardless of credentials:
#   Name: Snowflake
#   Variables:
#     user: WAREHOUSE_USER
#     account: WAREHOUSE_ACCOUNT       # <org>-<account>, from Snowsight ->
#                                      #   Account details -> Account identifier
#     database: WAREHOUSE_DATABASE
#     schema: WAREHOUSE_SCHEMA
#     warehouse: WAREHOUSE_WAREHOUSE
#     role: WAREHOUSE_ROLE
#     token: WAREHOUSE_TOKEN           # -> the Programmatic Access Token
#
# Snowflake, key-pair alternative — still supported for a team standardising
# on RSA key-pair auth instead of PATs. A single WAREHOUSE_JDBC_URL replaces
# all seven fields above:
#   Name: Snowflake
#   Variables:
#     jdbc_url: WAREHOUSE_JDBC_URL     # jdbc:snowflake://<account>.snowflakecomputing.com/
#                                      #   ?db=<db>&schema=<schema>&warehouse=<wh>
#     user: WAREHOUSE_USER
#     auth_mode: WAREHOUSE_AUTH_MODE   # -> key_file
#     key_file: WAREHOUSE_KEY_FILE     # -> path to the .p8 private key
#     secret: WAREHOUSE_SECRET         # -> the key's passphrase
#
# Trino, or any other SQL engine over plain Iceberg:
#   Name: Trino
#   Variables:
#     jdbc_url: WAREHOUSE_JDBC_URL     # jdbc:trino://<host>:8080/<catalog>/<schema>
#     user: WAREHOUSE_USER
#     auth_mode: WAREHOUSE_AUTH_MODE   # -> password, or none for an open cluster
#     secret: WAREHOUSE_SECRET
# -----------------------------------------------------------------------------

Cloning:
  # Mirrors Engine DB tables into the warehouse after each pipeline run, so a
  # team can query engine config/audit without a second connection. Off by
  # default; nothing is copied unless this is turned on.
  Enabled: false
  # cfg | aud | all
  #   cfg = the CFG_ tables (pipelines, tasks, dependencies, parameters, rules)
  #   aud = the AUD_ tables (run logs, trackers, business-rule results)
  #   all = both
  Scope: cfg

# -----------------------------------------------------------------------------
# Defaults for the DAGs `generate-yml` emits. Global fallbacks only: a pipeline's
# own CFG_PIPELINES.PIPELINE_PARAMETERS overrides any of these, and where both
# are absent the engine's own built-in default applies.
#
# [CHOICE] Named Dag_defaults, not Orchestrator. The section that carries Mode is
# now called Orchestration, and two sections one letter apart -- Orchestration
# and Orchestrator -- is a trap. This name says what the section actually holds,
# and stays orchestrator-neutral, which "Airflow" would not.
#
# These are literal VALUES, not variable names. The name-indirection rule applies
# to Variables blocks -- things that carry connection details and credentials.
# These are engine behaviour settings with nothing to hide.
# -----------------------------------------------------------------------------
Dag_defaults:
  # Emit the optional cross-pipeline trigger DAG. Off unless asked for.
  Global_dag: false
  Catchup: false
  Tags: [analytics]
  Retries: 1
  Retry_delay_minutes: 5
  Depends_on_past: false
  Email_on_failure: false
  # Inert unless Email_on_failure is true — Airflow needs somewhere to send.
  Email_recipients: [data-alerts@example.com]

# -----------------------------------------------------------------------------
# SMTP, for HANDLER=EMAIL_ALERT tasks. Optional: leave the whole section out if
# no active task sends mail.
#
# Same name-indirection rule: every value under Variables is a VARIABLE NAME.
# auth_mode here has its own smaller vocabulary — `none` or `password` only; an
# OAuth2 SMTP flow is provider-specific and deliberately not stubbed.
# -----------------------------------------------------------------------------
Email:
  Profile: dev
  Variables:
    host: EMAIL_HOST
    port: EMAIL_PORT
    from_address: EMAIL_FROM
    auth_mode: EMAIL_AUTH_MODE
    user: EMAIL_USER
    use_tls: EMAIL_USE_TLS
    secret: EMAIL_SECRET
