# =============================================================================
# craft-connector.yml — secrets read from a .env-style FILE
# =============================================================================
#
# The one rule that governs this whole file:
#
#     EVERY VALUE UNDER A PROFILE IS THE *NAME* OF A VARIABLE, NEVER THE VALUE.
#
# `jdbc_url: ENGINE_DEV_JDBC_URL` does not mean the URL is the literal string
# "ENGINE_DEV_JDBC_URL". It means: look up ENGINE_DEV_JDBC_URL in whatever
# Secrets.Source_type points at, and use what you find there.
#
# That is what makes this file safe to commit: it contains no hostnames, no
# usernames, no URLs and no credentials — only a map of where to find them.
# The same file works unchanged in dev, CI and prod; only the variables differ.
#
# There is deliberately no exception for "non-secret" fields like auth_mode.
# One rule, applied everywhere, beats a rule with a carve-out someone has to
# remember — and beats a loader guessing whether a value is a value or a name.
# -----------------------------------------------------------------------------

Orchestration:
  # local  = this machine is the scheduler (etl-craft run drives the waves)
  # remote = an orchestrator drives it; etl-craft only ever runs one task
  Mode: remote
  # Informational only. The engine never acts on it.
  Orchestrator_name: airflow

Secrets:
  Source_type: file
  # Every variable named below is looked up in this file.
  Source_path: /etc/etl-craft/.env

Engine:
  # Which profile is live. Overridable at runtime without editing this file:
  # set ETL_CRAFT_ENGINE_PROFILE in the environment and it wins.
  # There may be as many profiles as you like; exactly one is active.
  Active_profile: dev
  Profiles:
    local:
      jdbc_url: ENGINE_LOCAL_JDBC_URL
      user: ENGINE_LOCAL_USER
      auth_mode: ENGINE_LOCAL_AUTH_MODE
      secret: ENGINE_LOCAL_SECRET
    dev:
      jdbc_url: ENGINE_DEV_JDBC_URL
      user: ENGINE_DEV_USER
      auth_mode: ENGINE_DEV_AUTH_MODE
      secret: ENGINE_DEV_SECRET
    sit:
      jdbc_url: ENGINE_SIT_JDBC_URL
      user: ENGINE_SIT_USER
      auth_mode: ENGINE_SIT_AUTH_MODE
      secret: ENGINE_SIT_SECRET
    uat:
      jdbc_url: ENGINE_UAT_JDBC_URL
      user: ENGINE_UAT_USER
      auth_mode: ENGINE_UAT_AUTH_MODE
      secret: ENGINE_UAT_SECRET
    prod:
      jdbc_url: ENGINE_PROD_JDBC_URL
      user: ENGINE_PROD_USER
      auth_mode: ENGINE_PROD_AUTH_MODE
      secret: ENGINE_PROD_SECRET

Warehouse:
  # Postgres | Databricks | Snowflake | Trino. Checked against the dialect the
  # active profile's jdbc_url actually resolves to, so a Databricks URL filed
  # under Name: Snowflake is caught at setup rather than at 3am.
  Name: Postgres
  # iceberg | native. What format the engine creates tables in here.
  #   iceberg = readable by everything else in the lakehouse (the default)
  #   native  = the warehouse's own format: Delta on Databricks, a
  #             standard table on Snowflake
  # A single task can differ with CFG_TASK_PARAMETERS.TABLE_FORMAT.
  Table_format: iceberg
  # Overridable at runtime by ETL_CRAFT_WAREHOUSE_PROFILE.
  Active_profile: dev
  Profiles:
    local:
      jdbc_url: WAREHOUSE_LOCAL_JDBC_URL
      user: WAREHOUSE_LOCAL_USER
      auth_mode: WAREHOUSE_LOCAL_AUTH_MODE
      secret: WAREHOUSE_LOCAL_SECRET
    dev:
      jdbc_url: WAREHOUSE_DEV_JDBC_URL
      user: WAREHOUSE_DEV_USER
      auth_mode: WAREHOUSE_DEV_AUTH_MODE
      secret: WAREHOUSE_DEV_SECRET
    sit:
      jdbc_url: WAREHOUSE_SIT_JDBC_URL
      user: WAREHOUSE_SIT_USER
      auth_mode: WAREHOUSE_SIT_AUTH_MODE
      secret: WAREHOUSE_SIT_SECRET
    uat:
      jdbc_url: WAREHOUSE_UAT_JDBC_URL
      user: WAREHOUSE_UAT_USER
      auth_mode: WAREHOUSE_UAT_AUTH_MODE
      secret: WAREHOUSE_UAT_SECRET
    prod:
      jdbc_url: WAREHOUSE_PROD_JDBC_URL
      user: WAREHOUSE_PROD_USER
      auth_mode: WAREHOUSE_PROD_AUTH_MODE
      secret: WAREHOUSE_PROD_SECRET

# -----------------------------------------------------------------------------
# The same Warehouse section for each supported engine. Only the variables the
# file points at change — the shape never does.
#
# Databricks (Unity Catalog, Iceberg):
#   Name: Databricks
#   ...
#     prod:
#       jdbc_url: WAREHOUSE_PROD_JDBC_URL   # jdbc:databricks://<host>:443/default;
#                                           #   httpPath=/sql/1.0/warehouses/<id>;
#                                           #   ConnCatalog=<catalog>
#       auth_mode: WAREHOUSE_PROD_AUTH_MODE # -> token
#       secret: WAREHOUSE_PROD_SECRET       # -> the personal access token
#       # no `user`: Databricks' username is the literal "token", set for you
#
# Snowflake (Iceberg tables):
#   Name: Snowflake
#   ...
#     prod:
#       jdbc_url: WAREHOUSE_PROD_JDBC_URL   # jdbc:snowflake://<account>.snowflakecomputing.com/
#                                           #   ?db=<db>&schema=<schema>&warehouse=<wh>
#       user: WAREHOUSE_PROD_USER
#       auth_mode: WAREHOUSE_PROD_AUTH_MODE # -> key_file (the corporate standard)
#       key_file: WAREHOUSE_PROD_KEY_FILE   # -> path to the .p8 private key
#       secret: WAREHOUSE_PROD_SECRET       # -> the key's passphrase
#
# Trino, or any other SQL engine over plain Iceberg:
#   Name: Trino
#   ...
#     prod:
#       jdbc_url: WAREHOUSE_PROD_JDBC_URL   # jdbc:trino://<host>:8080/<catalog>/<schema>
#       user: WAREHOUSE_PROD_USER
#       auth_mode: WAREHOUSE_PROD_AUTH_MODE # -> password, or none for an open cluster
#       secret: WAREHOUSE_PROD_SECRET
# -----------------------------------------------------------------------------

Cloning:
  # Mirrors Engine DB tables into the warehouse after each pipeline run, so a
  # team can query engine config/audit without a second connection. Off by
  # default; nothing is copied unless this is turned on.
  Enabled: false
  # cfg | aud | all
  #   cfg = the CFG_ tables (pipelines, tasks, dependencies, parameters, rules)
  #   aud = the AUD_ tables (run logs, trackers, business-rule results)
  #   all = both
  Scope: cfg

# -----------------------------------------------------------------------------
# Defaults for the DAGs `generate-yml` emits. Global fallbacks only: a pipeline's
# own CFG_PIPELINES.PIPELINE_PARAMETERS overrides any of these, and where both
# are absent the engine's own built-in default applies.
#
# [CHOICE] Named Dag_defaults, not Orchestrator. The section that carries Mode is
# now called Orchestration, and two sections one letter apart -- Orchestration
# and Orchestrator -- is a trap. This name says what the section actually holds,
# and stays orchestrator-neutral, which "Airflow" would not.
#
# These are literal VALUES, not variable names. The name-indirection rule applies
# to profiles -- things that carry connection details and credentials. These are
# engine behaviour settings with nothing to hide.
# -----------------------------------------------------------------------------
Dag_defaults:
  # Emit the optional cross-pipeline trigger DAG. Off unless asked for.
  Global_dag: false
  Catchup: false
  Tags: [analytics]
  Retries: 1
  Retry_delay_minutes: 5
  Depends_on_past: false
  Email_on_failure: false
  # Inert unless Email_on_failure is true — Airflow needs somewhere to send.
  Email_recipients: [data-alerts@example.com]

# -----------------------------------------------------------------------------
# SMTP, for HANDLER=EMAIL_ALERT tasks. Optional: leave the whole section out if
# no active task sends mail.
#
# Profiles, so the same name-indirection rule applies: every value below is a
# VARIABLE NAME. auth_mode here has its own smaller vocabulary — `none` or
# `password` only; an OAuth2 SMTP flow is as provider-specific as the token/sso
# database modes and is deliberately not stubbed.
# -----------------------------------------------------------------------------
Email:
  Active_profile: dev
  Profiles:
    dev:
      host: EMAIL_DEV_HOST
      port: EMAIL_DEV_PORT
      from_address: EMAIL_DEV_FROM
      auth_mode: EMAIL_DEV_AUTH_MODE
      user: EMAIL_DEV_USER
      use_tls: EMAIL_DEV_USE_TLS
      secret: EMAIL_DEV_SECRET
    prod:
      host: EMAIL_PROD_HOST
      port: EMAIL_PROD_PORT
      from_address: EMAIL_PROD_FROM
      auth_mode: EMAIL_PROD_AUTH_MODE
      user: EMAIL_PROD_USER
      use_tls: EMAIL_PROD_USE_TLS
      secret: EMAIL_PROD_SECRET
