# Canonical craft-connector.yml, with values read from the process environment.
# Every value in a Variables block is a VARIABLE NAME, not its value. Keep this
# file in source control only after replacing the illustrative names as needed;
# keep the values those names resolve to out of source control.

Orchestration:
  # local: etl-craft schedules waves. remote: an external scheduler invokes
  # one task at a time. `generate-yml` emits a descriptor; it does not deploy
  # an Airflow DAG.
  Mode: local
  Orchestrator_name: airflow
  Task_timeout_seconds: 21600
  Max_parallel_tasks: 8
  Enforce_sla: false

Secrets:
  Source_type: environment

Engine:
  # ETL_CRAFT_ENGINE_PROFILE can select another tier at runtime.
  Profile: dev
  Variables:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    # Engine DB supports password or key_file.
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET

Warehouse:
  # PostgreSQL is the reference launch warehouse. The same shape supports
  # DuckDB (auth_mode none), Databricks (static token), Snowflake (key_file or
  # password), and Trino. See configuration.md for their exact requirements.
  Name: Postgres
  Table_format: native
  Profile: dev
  Variables:
    jdbc_url: WAREHOUSE_JDBC_URL
    user: WAREHOUSE_USER
    auth_mode: WAREHOUSE_AUTH_MODE
    secret: WAREHOUSE_SECRET

Cloning:
  Enabled: false
  Scope: cfg

Dag_defaults:
  Global_dag: false
  Catchup: false
  Tags: [analytics]
  Retries: 1
  Retry_delay_minutes: 5
  Depends_on_past: false
  Email_on_failure: false
  Email_recipients: [data-alerts@example.com]

# Optional. Required only when a pipeline has an EMAIL_ALERT task.
Email:
  Profile: dev
  Variables:
    host: EMAIL_HOST
    port: EMAIL_PORT
    from_address: EMAIL_FROM
    auth_mode: EMAIL_AUTH_MODE
    user: EMAIL_USER
    use_tls: EMAIL_USE_TLS
    secret: EMAIL_SECRET
