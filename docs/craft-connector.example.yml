# craft-connector.yml — written by you, read by etl-craft, never written by it.
#
# Sections, in this order (the loader refuses any other): Secrets, Orchestration
# (execution defaults and the Email relay live inside it), Engine, Warehouse, and
# optional Cloning and Docs_site sections. Orchestration may be left out: every
# setting in it has a default.
#
# Each section that differs by environment holds one block per profile — dev,
# sit, uat, prod here, but any names work. The active one is the section's own
# Profile, else Secrets.Profile. A setting written beside the profile blocks
# applies to every profile; the same setting inside a block overrides it there.
#
# Every setting is a VARIABLE or a VALUE, and each line below says which:
#
#   * text that names a variable set in the secrets source (the environment, or
#     the file Secrets points at) takes that variable's value;
#   * anything else is used exactly as written: `Profile: dev` is the profile
#     dev, `Profile: ETL_CRAFT_PROFILE` is whatever that variable holds;
#   * a secret (secret, token, s3_secret) must be a variable that is set —
#     never written into this file. Every command checks this when it loads the
#     file, for the selected profile, and stops with a "not set" error otherwise.
#
# So the same variable names can serve every environment, each setting its own
# values, and the file stays safe to commit. A profile-specific variable
# (ENGINE_PROD_SECRET) wins over the plain one (ENGINE_SECRET) for that profile.
# `etl-craft doctor` lists every value used as written that looks like a
# variable name — the way a missing variable shows up.
#
# As written, this file works for local development with nothing set: a SQLite
# Engine DB and a DuckDB warehouse, both files beside this one. Run
# `etl-craft setup`, then `etl-craft doctor`. docs/examples/ has a complete file
# for every Engine DB, warehouse, secrets source and
# authentication type.

Secrets:
  Source_type: ENVIRONMENT             # value — ENVIRONMENT | FILE
  # Path: .env                    # Source_type: FILE only — relative to this file
  Profile: dev                         # value — the default profile for every section below;
                                       # write ETL_CRAFT_PROFILE to set it per environment

Orchestration:
  Retry_on: TRANSIENT                 # value; retry only failures that can succeed
  # Profile: prod                 # overrides Secrets.Profile for this section only
  # Log_dir: logs                 # where each task attempt's log file goes; relative to this file
  Task_timeout_seconds: 21600          # value — 0 disables; a task's TASK_TIMEOUT_SECONDS overrides
  # Api_address: 127.0.0.1:8730    # API/UI listener; controller --no-ui serves /health here
  Timezone: UTC                  # default logical date for manual runs and schedules
  Shutdown_grace_seconds: 60           # value — controller waits before stopping local work
  Engine_db_outage_seconds: 120       # value — how long a process that reached a PostgreSQL
                                       # Engine DB waits for it after a restart or failover;
                                       # 0: fail at the first refused connection
  # Local_python_slots: 2             # value — optional: at most this many Python script
  #                                    # tasks at once; unset, they may use every slot
  # Local_warehouse_slots: 6           # value — optional: the same for SQL, rule and alert tasks
  Gate_wait_minutes: 60                # value — how long a run waits for a running upstream
                                       # pipeline or task it depends on; 0: judge at once
  Enforce_sla: false                   # value — true: send an SLA email (Email below) when a
                                       # run misses its pipeline's SLA_IN_HOURS. Runs are
                                       # marked MET or BREACHED either way.

  # Task RETRIES overrides the project retry count; pipeline EMAIL_RECIPIENTS
  # overrides the project alert recipients.
  dev:
    Dependency_gates: WARN             # value — ENFORCE (default) | WARN | OFF. WARN
                                       # and OFF let a run go ahead when its dependencies on
                                       # other pipelines are not satisfied, and record the bypass
    Allow_schedule: false              # value — default true; false: this environment's
                                       # controller starts no runs from RUN_SCHEDULE
    Retries: 1                         # value
  sit:
    Retries: 1                         # value
    Email:                        # how EMAIL_ALERT tasks and SLA emails are sent —
      # Transport: SMTP                # value — SMTP (the default) | SENDMAIL: hand mail to the
      #                                #   host's sendmail program, with From_address and
      #                                #   nothing else
      # Sendmail_path: /usr/sbin/sendmail  # value — with Transport: SENDMAIL; the default
      Host: EMAIL_HOST                 # variable —   needed only when a pipeline sends email
      Port: EMAIL_PORT                 # variable
      From_address: EMAIL_FROM         # variable
      From_name: ETL Craft             # value — optional: the name shown with from_address
      Auth_mode: EMAIL_AUTH_MODE       # variable — NONE | PASSWORD | OAUTH
      User: EMAIL_USER                 # variable
      Tls_mode: EMAIL_TLS_MODE         # variable — STARTTLS | SSL | NONE
      # Ca_file: EMAIL_CA_FILE         # variable — optional CA certificate, relative to this file
      Secret: EMAIL_SECRET             # variable, required: a secret is never used as written
      # Client_id: EMAIL_CLIENT_ID     # variable — with Auth_mode OAUTH (SMTP XOAUTH2): the app's
      # Token_url: EMAIL_TOKEN_URL     #   client id, the token endpoint, and the scope to ask for;
      # Scope: EMAIL_SCOPE             #   secret is then the client secret
  uat:
    Retries: 1                         # value
    Email:
      Host: EMAIL_HOST                 # variable
      Port: EMAIL_PORT                 # variable
      From_address: EMAIL_FROM         # variable
      Auth_mode: EMAIL_AUTH_MODE       # variable
      User: EMAIL_USER                 # variable
      Tls_mode: EMAIL_TLS_MODE         # variable — STARTTLS | SSL | NONE
      Secret: EMAIL_SECRET             # variable, required: a secret is never used as written
  prod:
    Retries: 1                         # value
    Email_recipients: [data-alerts@example.com]  # value
    Email:
      Host: EMAIL_HOST                 # variable
      Port: EMAIL_PORT                 # variable
      From_address: EMAIL_FROM         # variable
      Auth_mode: EMAIL_AUTH_MODE       # variable
      User: EMAIL_USER                 # variable
      Tls_mode: EMAIL_TLS_MODE         # variable — STARTTLS | SSL | NONE
      Secret: EMAIL_SECRET             # variable, required: a secret is never used as written

# Deployment:                          # optional; no profile blocks: Profile names the shape
#   Profile: LAPTOP                    # value or variable — LAPTOP | CONTROLLER | CONTROLLER_AGENTS.
#                                      # Unset: slots, threads and pools come from the settings
#                                      # above. Set: run and controller size them from the measured
#                                      # CPU and memory, with the settings above as ceilings.
#                                      # `etl-craft doctor` shows the sizes before you choose.

Engine:
  # SQLite (one file, nothing to install) or PostgreSQL (recommended for
  # production). Name is optional — Postgres | SQLite — and checked against
  # Jdbc_url.
  # Profile: prod
  dev:
    Jdbc_url: jdbc:sqlite:etl-craft-engine.db  # value — relative to this file
    Schema: main                       # value — SQLite: the database file is the schema
  sit:
    Name: Postgres                     # value
    Jdbc_url: ENGINE_JDBC_URL          # variable — jdbc:postgresql://host:5432/etl_craft
    # Listen_jdbc_url: ENGINE_LISTEN_URL # variable — optional, PostgreSQL only: a direct or
    #                                    # session-pooled address for LISTEN, with this profile's
    #                                    # login; unset, Jdbc_url. Startup and doctor prove a
    #                                    # NOTIFY arrives (transaction pooling drops them)
    Schema: etl_craft                  # value — must already exist; the engine never creates it
    User: ENGINE_USER                  # variable
    Auth_mode: ENGINE_AUTH_MODE        # variable — PASSWORD | KEY_FILE | TOKEN | OAUTH | SSO | STS
    Secret: ENGINE_SECRET              # variable, required: a secret is never used as written — the password, or the key's passphrase
    Key_file: ENGINE_KEY_FILE          # variable — Auth_mode KEY_FILE only: the client key's path
  uat:
    Name: Postgres                     # value
    Jdbc_url: ENGINE_JDBC_URL          # variable
    Schema: etl_craft                  # value — must already exist; the engine never creates it
    User: ENGINE_USER                  # variable
    Auth_mode: ENGINE_AUTH_MODE        # variable
    Secret: ENGINE_SECRET              # variable, required: a secret is never used as written
    Key_file: ENGINE_KEY_FILE          # variable
  prod:
    Name: Postgres                     # value
    Jdbc_url: ENGINE_JDBC_URL          # variable
    Schema: etl_craft                  # value — must already exist; the engine never creates it
    User: ENGINE_USER                  # variable
    Auth_mode: ENGINE_AUTH_MODE        # variable
    Secret: ENGINE_SECRET              # variable, required: a secret is never used as written
    Key_file: ENGINE_KEY_FILE          # variable

Warehouse:
  Max_warehouse_queries: 8           # value: shared upper bound on claimed/running warehouse tasks
  # Name: Postgres | DuckDB | Trino | Databricks | Snowflake — checked against
  # the connection. Table_format: NATIVE (the default) | ICEBERG; a task's
  # TABLE_FORMAT parameter overrides it. Both may sit here, for every profile,
  # or inside a profile, as below.
  # Profile: prod
  dev:
    Name: DuckDB                       # value
    Jdbc_url: jdbc:duckdb:warehouse.duckdb  # value — relative to this file
    Schema: main                       # value — must already exist; cloning writes here
  sit:
    Name: Postgres                     # value
    Table_format: NATIVE               # value — always NATIVE: Postgres has no Iceberg tables
    Jdbc_url: WAREHOUSE_JDBC_URL       # variable — jdbc:postgresql://host:5432/analytics
    Schema: etl_craft                  # value — must already exist; cloning writes here
    User: WAREHOUSE_USER               # variable
    Auth_mode: WAREHOUSE_AUTH_MODE     # variable
    Secret: WAREHOUSE_SECRET           # variable, required: a secret is never used as written
  uat:
    Name: Postgres                     # value
    Table_format: NATIVE               # value
    Jdbc_url: WAREHOUSE_JDBC_URL       # variable
    Schema: etl_craft                  # value — must already exist; cloning writes here
    User: WAREHOUSE_USER               # variable
    Auth_mode: WAREHOUSE_AUTH_MODE     # variable
    Secret: WAREHOUSE_SECRET           # variable, required: a secret is never used as written
  prod:
    Name: Postgres                     # value
    Table_format: NATIVE               # value
    Jdbc_url: WAREHOUSE_JDBC_URL       # variable
    Schema: etl_craft                  # value — must already exist; cloning writes here
    User: WAREHOUSE_USER               # variable
    Auth_mode: WAREHOUSE_AUTH_MODE     # variable
    Secret: WAREHOUSE_SECRET           # variable, required: a secret is never used as written

# Optional. Mirrors Engine DB tables into the warehouse after each pipeline run.
Cloning:
  # Profile: prod
  dev:
    Enabled: false                     # value — default false
    Scope: CFG                         # value — CFG | AUD | ALL | NONE
  sit:
    Enabled: false                     # value
    Scope: NONE                        # value
  uat:
    Enabled: true                      # value
    Scope: CFG                         # value
  prod:
    Enabled: true                      # value
    Scope: ALL                         # value

# Optional organization-hosted catalog; no ngrok setup needed.
# Docs_site:
#   External_url: https://docs.example.com/etl-craft/
#   Trusted_proxies: [127.0.0.1/32]   # Only the proxy's actual source addresses.
#   Allowed_ips: [203.0.113.0/24]    # Optional visitor/VPN networks, not proxy networks.

# Account sign-in settings; the optional Auth section follows Docs_site.
# Auth:
#   Session_hours: 12                   # value — integer 1..8760; local session lifetime
#   Refresh_days: 30                    # value — integer 1..365; server sign-in refresh lifetime
#   Oidc_issuer: https://sso.example.com # value — exact HTTPS issuer, paired with Oidc_client_id
#   Oidc_client_id: etl-craft            # value — public device-flow client, RS256 ID tokens

#   Oidc_groups_claim: groups             # optional claim of group names; needs OIDC settings above

# Optional immutable publications; omit Artifacts for local working-tree development.
# Artifacts:
#   Store: file:///srv/etl-craft/artifacts
# Object_stores:
#   artifacts:
#     Endpoint: https://objects.example.com
#     Region: us-east-1
#     Url_style: PATH
#     Auth_mode: KEYS
#     Access_key_id: ARTIFACT_ACCESS_KEY
#     Secret_access_key: ARTIFACT_SECRET_KEY
# Artifacts:
#   Store: s3://project-artifacts/production
#   Profile: artifacts
