# =============================================================================
# craft-connector.yml — secrets read from the ENVIRONMENT (CI, containers)
# =============================================================================
#
# Identical in shape to craft-connector.file-secrets.example.yml. The only
# difference is Secrets.Source_type, so the same file can move between a laptop
# and CI by changing one line — or by changing nothing at all, if you keep two
# files.
#
# Same single rule: EVERY VALUE UNDER Variables IS A VARIABLE *NAME*.
# Nothing here is a hostname, a user or a credential. In GitHub Actions these
# names are what you put on the step:
#
#     env:
#       ENGINE_JDBC_URL: ${{ secrets.ENGINE_JDBC_URL }}
#       ENGINE_SECRET:   ${{ secrets.ENGINE_SECRET }}
#
# The names carry NO environment tier. There is no ENGINE_PROD_JDBC_URL. A
# prod deployment sets ENGINE_JDBC_URL to its prod value; a UAT deployment sets
# the same name to its UAT value. That is the whole point: one image, one set
# of names, and `Profile` below says which tier this deployment is.
#
# This example shows a Databricks warehouse, where the file-secrets example
# shows Postgres. See configuration.md for the supported Snowflake, Trino, and
# DuckDB configurations.
# -----------------------------------------------------------------------------

Orchestration:
  Mode: remote
  Orchestrator_name: airflow

Secrets:
  # No Source_path: every variable named below is read from the process
  # environment.
  Source_type: environment

Engine:
  # Which tier this deployment is. $ETL_CRAFT_ENGINE_PROFILE overrides it,
  # which is how one image serves dev/sit/uat/prod without a rebuild.
  #
  # It selects the tier, not the variable names — those never change.
  Profile: prod
  Variables:
    jdbc_url: ENGINE_JDBC_URL
    user: ENGINE_USER
    auth_mode: ENGINE_AUTH_MODE
    secret: ENGINE_SECRET

Warehouse:
  Name: Databricks
  # iceberg | native. What format the engine creates tables in here.
  #   iceberg = a managed Delta table with UniForm enabled — Iceberg-readable
  #             by everything else in the lakehouse (the default; verified
  #             live 2026-09-23, see CLAUDE.md's "Where things stand")
  #   native  = the warehouse's own format: Delta on Databricks, a standard
  #             table on Snowflake
  # A single task can differ with CFG_TASK_PARAMETERS.TABLE_FORMAT.
  Table_format: iceberg
  Profile: prod
  Variables:
    # TESTED AND RECOMMENDED shape (verified live 2026-09-23): a plain JDBC
    # URL (host + port + httpPath only) plus catalog, schema and token as
    # their own variables, rather than one URL with catalog/schema packed
    # into its query string. auth_mode is always `token` for Databricks —
    # not a separate variable — and its username is the literal "token",
    # supplied by the engine, so there is no `user` here either.
    jdbc_url: WAREHOUSE_JDBC_URL
    catalog: WAREHOUSE_CATALOG
    schema: WAREHOUSE_SCHEMA
    token: WAREHOUSE_TOKEN

Cloning:
  # Mirrors Engine DB tables into the warehouse after each pipeline run, so a
  # team can query engine config/audit without a second connection. Off by
  # default; nothing is copied unless this is turned on.
  Enabled: false
  # cfg | aud | all
  #   cfg = the CFG_ tables (pipelines, tasks, dependencies, parameters, rules)
  #   aud = the AUD_ tables (run logs, trackers, business-rule results)
  #   all = both
  Scope: cfg

# -----------------------------------------------------------------------------
# Defaults for the DAGs `generate-yml` emits. Global fallbacks only: a pipeline's
# own CFG_PIPELINES.PIPELINE_PARAMETERS overrides any of these, and where both
# are absent the engine's own built-in default applies.
#
# [CHOICE] Named Dag_defaults, not Orchestrator. The section that carries Mode is
# now called Orchestration, and two sections one letter apart -- Orchestration
# and Orchestrator -- is a trap. This name says what the section actually holds,
# and stays orchestrator-neutral, which "Airflow" would not.
#
# These are literal VALUES, not variable names. The name-indirection rule applies
# to Variables blocks -- things that carry connection details and credentials.
# These are engine behaviour settings with nothing to hide.
# -----------------------------------------------------------------------------
Dag_defaults:
  # Emit the optional cross-pipeline trigger DAG. Off unless asked for.
  Global_dag: false
  Catchup: false
  Tags: [analytics]
  Retries: 1
  Retry_delay_minutes: 5
  Depends_on_past: false
  Email_on_failure: false
  # Inert unless Email_on_failure is true — Airflow needs somewhere to send.
  Email_recipients: [data-alerts@example.com]

# -----------------------------------------------------------------------------
# SMTP, for HANDLER=EMAIL_ALERT tasks. Optional: leave the whole section out if
# no active task sends mail.
#
# Same name-indirection rule: every value under Variables is a VARIABLE NAME.
# auth_mode here has its own smaller vocabulary — `none` or `password` only; an
# OAuth2 SMTP flow is provider-specific and deliberately not stubbed.
# -----------------------------------------------------------------------------
Email:
  Profile: prod
  Variables:
    host: EMAIL_HOST
    port: EMAIL_PORT
    from_address: EMAIL_FROM
    auth_mode: EMAIL_AUTH_MODE
    user: EMAIL_USER
    use_tls: EMAIL_USE_TLS
    secret: EMAIL_SECRET
