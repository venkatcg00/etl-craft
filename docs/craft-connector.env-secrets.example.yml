# =============================================================================
# craft-connector.yml — secrets read from the ENVIRONMENT (CI, containers)
# =============================================================================
#
# Identical in shape to craft-connector.file-secrets.example.yml. The only
# difference is Secrets.Source_type, so the same file can move between a laptop
# and CI by changing one line — or by changing nothing at all, if you keep two
# files.
#
# Same single rule: EVERY VALUE UNDER A PROFILE IS A VARIABLE *NAME*.
# Nothing here is a hostname, a user or a credential. In GitHub Actions these
# names are what you put on the step:
#
#     env:
#       ENGINE_PROD_JDBC_URL: ${{ secrets.ENGINE_PROD_JDBC_URL }}
#       ENGINE_PROD_SECRET:   ${{ secrets.ENGINE_PROD_SECRET }}
#
# This example shows a Databricks warehouse, where the file-secrets example
# shows Postgres; between the two, every supported engine appears concretely.
# -----------------------------------------------------------------------------

Orchestration:
  Mode: remote
  Orchestrator_name: airflow

Secrets:
  # No Source_path: every variable named below is read from the process
  # environment.
  Source_type: environment

Engine:
  # ETL_CRAFT_ENGINE_PROFILE overrides this at runtime, which is how one image
  # serves dev/sit/uat/prod without a rebuild.
  Active_profile: prod
  Profiles:
    local:
      jdbc_url: ENGINE_LOCAL_JDBC_URL
      user: ENGINE_LOCAL_USER
      auth_mode: ENGINE_LOCAL_AUTH_MODE
      secret: ENGINE_LOCAL_SECRET
    dev:
      jdbc_url: ENGINE_DEV_JDBC_URL
      user: ENGINE_DEV_USER
      auth_mode: ENGINE_DEV_AUTH_MODE
      secret: ENGINE_DEV_SECRET
    sit:
      jdbc_url: ENGINE_SIT_JDBC_URL
      user: ENGINE_SIT_USER
      auth_mode: ENGINE_SIT_AUTH_MODE
      secret: ENGINE_SIT_SECRET
    uat:
      jdbc_url: ENGINE_UAT_JDBC_URL
      user: ENGINE_UAT_USER
      auth_mode: ENGINE_UAT_AUTH_MODE
      secret: ENGINE_UAT_SECRET
    prod:
      jdbc_url: ENGINE_PROD_JDBC_URL
      user: ENGINE_PROD_USER
      auth_mode: ENGINE_PROD_AUTH_MODE
      secret: ENGINE_PROD_SECRET

Warehouse:
  Name: Databricks
  Active_profile: prod
  Profiles:
    # Databricks authenticates with a personal access token, and its username
    # is the literal "token" — supplied by the engine — so these profiles
    # declare no `user` at all.
    local:
      jdbc_url: WAREHOUSE_LOCAL_JDBC_URL
      auth_mode: WAREHOUSE_LOCAL_AUTH_MODE
      secret: WAREHOUSE_LOCAL_SECRET
    dev:
      jdbc_url: WAREHOUSE_DEV_JDBC_URL
      auth_mode: WAREHOUSE_DEV_AUTH_MODE
      secret: WAREHOUSE_DEV_SECRET
    sit:
      jdbc_url: WAREHOUSE_SIT_JDBC_URL
      auth_mode: WAREHOUSE_SIT_AUTH_MODE
      secret: WAREHOUSE_SIT_SECRET
    uat:
      jdbc_url: WAREHOUSE_UAT_JDBC_URL
      auth_mode: WAREHOUSE_UAT_AUTH_MODE
      secret: WAREHOUSE_UAT_SECRET
    prod:
      jdbc_url: WAREHOUSE_PROD_JDBC_URL
      auth_mode: WAREHOUSE_PROD_AUTH_MODE
      secret: WAREHOUSE_PROD_SECRET

Cloning:
  # Mirrors Engine DB tables into the warehouse after each pipeline run, so a
  # team can query engine config/audit without a second connection. Off by
  # default; nothing is copied unless this is turned on.
  Enabled: false
  # cfg | aud | all
  #   cfg = the CFG_ tables (pipelines, tasks, dependencies, parameters, rules)
  #   aud = the AUD_ tables (run logs, trackers, business-rule results)
  #   all = both
  Scope: cfg

# -----------------------------------------------------------------------------
# Defaults for the DAGs `generate-yml` emits. Global fallbacks only: a pipeline's
# own CFG_PIPELINES.PIPELINE_PARAMETERS overrides any of these, and where both
# are absent the engine's own built-in default applies.
#
# [CHOICE] Named Dag_defaults, not Orchestrator. The section that carries Mode is
# now called Orchestration, and two sections one letter apart -- Orchestration
# and Orchestrator -- is a trap. This name says what the section actually holds,
# and stays orchestrator-neutral, which "Airflow" would not.
#
# These are literal VALUES, not variable names. The name-indirection rule applies
# to profiles -- things that carry connection details and credentials. These are
# engine behaviour settings with nothing to hide.
# -----------------------------------------------------------------------------
Dag_defaults:
  # Emit the optional cross-pipeline trigger DAG. Off unless asked for.
  Global_dag: false
  Catchup: false
  Tags: [analytics]
  Retries: 1
  Retry_delay_minutes: 5
  Depends_on_past: false
  Email_on_failure: false
  # Inert unless Email_on_failure is true — Airflow needs somewhere to send.
  Email_recipients: [data-alerts@example.com]

# -----------------------------------------------------------------------------
# SMTP, for HANDLER=EMAIL_ALERT tasks. Optional: leave the whole section out if
# no active task sends mail.
#
# Profiles, so the same name-indirection rule applies: every value below is a
# VARIABLE NAME. auth_mode here has its own smaller vocabulary — `none` or
# `password` only; an OAuth2 SMTP flow is as provider-specific as the token/sso
# database modes and is deliberately not stubbed.
# -----------------------------------------------------------------------------
Email:
  Active_profile: prod
  Profiles:
    dev:
      host: EMAIL_DEV_HOST
      port: EMAIL_DEV_PORT
      from_address: EMAIL_DEV_FROM
      auth_mode: EMAIL_DEV_AUTH_MODE
      user: EMAIL_DEV_USER
      use_tls: EMAIL_DEV_USE_TLS
      secret: EMAIL_DEV_SECRET
    prod:
      host: EMAIL_PROD_HOST
      port: EMAIL_PROD_PORT
      from_address: EMAIL_PROD_FROM
      auth_mode: EMAIL_PROD_AUTH_MODE
      user: EMAIL_PROD_USER
      use_tls: EMAIL_PROD_USE_TLS
      secret: EMAIL_PROD_SECRET
